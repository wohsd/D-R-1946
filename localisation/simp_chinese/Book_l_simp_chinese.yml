l_simp_chinese:
 book_gui_button_tooltip:0 "这里是图书馆，您可以利于看海的时间在这里阅读著作"
 book_name_desc:0 "香烟"
 book_Author_desc:0 "三岛由纪夫"
 book_title_desc:0 "那个匆匆而过的少年时代，对于我来说，实在想不起有什么快乐和美好。“灿烂的阳光照亮每个角落。”波德莱尔吟诵道，“我的青春一概都是黑暗的风暴。”少年时代的回忆充满奇妙的悲剧色彩。\n\n成长，以及对成长本身的回忆，为什么必须是悲剧化的呢？对于这些，我至今也弄不明白。没有人会知道。老年的静谧的智慧，将伴着秋末时常有的干爽和明净落到我们每人的头上，到了那一天，我也许会顿然明白过来吧。然而，那时候即使明白，也变得毫无意义了。每天什么也没解决，就那么度过了。\n\n少年时代，连那些不值一提的小事都难于忍耐。少年，丧失了童年的狡狯，觉得可厌。他打算从头开始。但是，对于他的这个“从头开始”，世界又是如何冷淡啊！没有一个人在乎他的行动，总是一次又一次错误地对待他。有时把他当做大人，有时又把他看成小孩子。也许因为他缺少稳定的缘故吧？不，细想想，他的少年时代具有在别处无法得到的稳定，他为着不知对此如何命名而感到苦恼。这就是成长。\n\n他终于为此起了名字。成功使他安心，使他感到自豪。但是命名时刹那间得以稳定的东西，和未命名时比起来，完全变成另一种东西了。不过，他对这一点也毫无觉察。就是说，他长大了——童年珍藏着一个密封而盖上印鉴的箱子。\n\n少年千方百计想打开看个究竟。盖子打开了，里头什么也没有。于是，他明白了：“百宝箱这种东西，一直都是空空洞洞的。”从此以后，他非常看重自己确立的定理。就是说，他已成为大人了。但是，百宝箱果真是空的吗？打开盖子时，不是有些看不见的重要的东西逃出来了吗？这种变成大人的事实，对于我来说，并非一种完成或毕业。少年时代本应该永远延续下去，而且如今不是也在一直延续下去吗？既然这样，我们又怎能轻视它呢？——因为一到少年，我就很难信赖友情。所有的朋友都是傻瓜，使我不能忍耐。\n\n学校，这种愚蠢的组织，强迫我们白天大部分时间都在这里度过，硬要我们在有限的几十个无聊的同班同学中选择朋友。在这狭窄的围墙内，聚集着具有相同智慧的数十位朋友，还有每年都拿着同样的教学笔记、利用教科书某一部分开着相同玩笑的老师们（我曾经和B班的同学计算过，看看那位化学老师上课后几分钟开始说玩笑话。\n\n他在我们班是二十五分钟后；在B班则是十一点三十五分，也是在二十五分之后）。在这样的范围内，究竟要我学些什么呢？此外，在这个圈子里，大人们命令我单单学习“善的东西”。于是我们学会了模仿炼金术士的处世方法。最巧妙的炼金术士被称为优等生。他从铅里鼓捣出一种奇怪的金属，叫订货人相信那是金子。最后，自己也相信真的能造出金子了。优等生是最熟练的炼金术士。"