DRV_focus_0: "民族独立浪潮"
DRV_focus_0_desc: "随着二战结束，亚洲民族独立运动风起云涌。越南帝国作为法属印度支那的核心，必须抓住这一历史机遇，宣布独立，脱离法国殖民统治，建立属于越南人自己的国家。"

DRV_focus_1: "战时紧急措施"
DRV_focus_1_desc: "国家初立，百废待兴。为了维护新生政权的稳定，我们必须采取一系列紧急措施：稳定物价、恢复秩序、收编散兵游勇、肃清敌对势力。这些紧急措施将在战时持续生效，直至国家完全稳定。"

DRV_focus_2: "成立战时法庭"
DRV_focus_2_desc: "为了惩治叛国者、通敌卖国者以及战争罪犯，我们必须成立战时法庭。战时法庭将拥有特别司法权限，可以快速审理各类危害国家安全的案件，确保新生政权不受内敌破坏。"

DRV_focus_3: "下达总动员令"
DRV_focus_3_desc: "为了应对可能的外敌入侵和内乱，我们必须下达总动员令。全民备战，适龄青年踊跃参军，后方民众全力支援前线。每一个越南人都应为国家的独立和自由而战。"

DRV_focus_4: "开展爱国竞赛"
DRV_focus_4_desc: "在全国范围内开展爱国竞赛运动，鼓励工厂提高产量、农民多打粮食、军人英勇杀敌。竞赛的优胜者将获得崇高荣誉，成为全国人民学习的楷模。"

DRV_focus_5: "扩编越南青年自卫团"
DRV_focus_5_desc: "越南青年自卫团是我们重要的武装力量。我们将扩大自卫团的编制，招募更多热血青年，进行严格的军事训练，使之成为保卫祖国的重要力量。"

DRV_focus_6: "组建劳犯营"
DRV_focus_6_desc: "由于人力的短缺，我们必须组建一支新的作战部队，虽然是由劳犯组成，但在严格的军规下也能发挥不错的战斗力。"


DRV_focus_7: "英雄主义宣传"
DRV_focus_7_desc: "我们无法承担劳犯背叛的后果，我们必须在民间大力宣传，树立英雄形象，号召更多的青年来保家卫国。"

DRV_focus_8: "独立，自由，幸福"
DRV_focus_8_desc: "这是我们对越南人民的庄严承诺：独立——脱离一切殖民统治；自由——摆脱压迫与奴役；幸福——让每一个越南人都能过上安居乐业的生活。这三大目标将指引我们前进的方向。"

DRV_focus_9: "寻求中国外交支持"
DRV_focus_9_desc: "中国作为越南最重要的邻国和传统的宗主国，其外交支持对我们至关重要。我们将派遣使团前往中国，争取中国的承认与支持，建立稳固的中越友好关系。"

DRV_focus_10: "打压左派阵线"
DRV_focus_10_desc: "左派势力对国家安全构成潜在威胁。我们将采取措施打压极左势力，防止共产主义思想的蔓延，维护国家政治稳定和社会秩序。"

DRV_focus_11: "改造农村"
DRV_focus_11_desc: "农村是越南社会的根基。我们将推行农村改造运动，改善农村基础设施、提高农业生产、普及基础教育，让广大农民享受到国家发展的成果。"

DRV_focus_11_tt: "([DRV.Getflag]§H[DRV.Getname]§!)\n所有地区添加§H$DRV_Rural_reform$§!的修正"

DRV_focus_12: "维护国民党地位"
DRV_focus_12_desc: "越南国民党是国家的执政党，我们必须维护其执政地位。通过各种政策手段巩固党的权威，确保国家政治方向的稳定性和连续性。"

DRV_focus_13: "百废待兴的越南"
DRV_focus_13_desc: "战争给越南带来了巨大的破坏，工业瘫痪、基础设施损毁、经济凋敝。我们必须制定全面的重建计划，让越南重新焕发生机。"


DRV_focus_14: "逮捕宗教领袖"
DRV_focus_14_desc: "某些宗教领袖利用宗教名义从事分裂活动，危害国家安全。我们将依法逮捕这些首恶分子，清除宗教极端主义对国家的威胁。"

DRV_focus_15: "战火中淬炼的军队"
DRV_focus_15_desc: "我们的军队在战火中诞生，在战斗中成长。通过实战锻炼和严格训练，我们将打造一支精锐之师，确保能够保卫国家的独立与安全。"

DRV_focus_16: "社会主义兄弟同袍"
DRV_focus_16_desc: "中国与越南山水相连，两国人民有着深厚的传统友谊。我们将与中国建立兄弟般的友好关系，在政治、经济、军事等方面开展全面合作。"

DRV_focus_17: "解放中南半岛"
DRV_focus_17_desc: "中南半岛各族人民都渴望独立与自由。越南帝国将承担起历史使命，解放老挝、柬埔寨、暹罗等地区，建立一个自由、独立、幸福的中南半岛联邦。"

DRV_focus_18: "支持柬埔寨游击队"
DRV_focus_18_desc: "柬埔寨人民正在遭受压迫，我们有责任支持他们的正义斗争。越南将向柬埔寨游击队提供物资援助和军事指导，帮助他们早日获得解放。"

DRV_focus_19: "潜入暹罗"
DRV_focus_19_desc: "暹罗是中南半岛的重要国家，但目前处于反动政权统治之下。我们将派遣特工人员潜入暹罗，建立情报网络，为将来的解放行动做准备。"



DRV_focus_20: "释放巨象"
DRV_focus_20_desc: "大象是东南亚的象征，代表着力量与尊严。我们将建立大象军团，利用这些巨兽在丛林作战中的独特优势，打造一支令敌人闻风丧胆的特殊部队。"

DRV_focus_21: "研发缴获武器"
DRV_focus_21_desc: "战争中我们缴获了大量的敌方武器装备。我们将组织技术人员研究这些武器，逆向工程仿制，尽快实现武器装备的国产化，摆脱对外国的依赖。"

DRV_focus_22: "发展越南军工"
DRV_focus_22_desc: "强大的国防离不开先进的军事工业。我们将集中力量发展兵工厂、弹药厂等军工产业，为军队提供充足的武器弹药保障。"

DRV_focus_23: "将土改带回越南"
DRV_focus_23_desc: "土地是农民的生命线。我们将推行土地改革，将地主阶级的土地分配给无地或少地的农民，实现'耕者有其田'的理想，激发农民的生产积极性。"

DRV_focus_24: "树立村社民兵制"
DRV_focus_24_desc: "农村是国家的根基，农民是国家的命脉。我们将在每个村庄建立民兵组织，平时维护地方安全，战时支援正规部队，形成全民皆兵的态势。"
DRV_focus_24_tt: "([DRV.Getflag]§H[DRV.Getname]§!)\n所有地区添加§H$DRV_militia$§!的修正"



DRV_focus_25: "打击腐败制度"
DRV_focus_25_desc: "腐败是国家的毒瘤，严重损害政府形象和人民利益。我们将成立专门的反腐机构，彻查各级官员的贪腐行为，严惩不贷，还人民一个清明的政府。"

DRV_focus_26: "爱国卫生运动"
DRV_focus_26_desc: "健康是人民幸福的基础。我们将发起爱国卫生运动，改善城乡卫生条件，普及医疗卫生知识，接种疫苗，消灭传染病，提高全民族的健康水平。"

DRV_focus_27: "土地租金减免"
DRV_focus_27_desc: "农民负担过重是制约农业生产的重要因素。我们将通过立法手段限制地租，减轻农民负担，保障农民的合法权益，让农民能够安心生产。"

DRV_focus_28: "制定新劳动法"
DRV_focus_28_desc: "工人是工业生产的主力军。我们将制定保障工人权益的新劳动法，规定最低工资、工时限制、安全生产条件等，让工人能够体面地工作和生活。"

DRV_focus_29: "弘扬传统文化"
DRV_focus_29_desc: "越南有着悠久的历史和灿烂的文化。我们将大力弘扬传统文化，保护历史遗迹，传承民族精神，让人民对自己的文化感到自豪，增强民族凝聚力。"

DRV_focus_30: "立法汉语必修课"
DRV_focus_30_desc: "汉语是东亚最重要的语言，也是与中华文化交流的桥梁。我们将在学校设立汉语必修课，培养精通汉语的人才，为两国交流合作奠定基础。"

DRV_focus_31: "优待华桥学生"
DRV_focus_31_desc: "华侨华人是我们重要的同胞。我们将为华侨学生提供优惠政策，鼓励他们回国升学，培养对祖国的感情，让他们成为中越友好的使者。"


DRV_focus_32: "中越友谊公路"
DRV_focus_32_desc: "交通基础设施是两国交流的纽带。我们将修建连接中越边境的友谊公路，促进贸易往来和人员交流，巩固两国的友好关系。"

DRV_focus_33: "成立越南国家银行"
DRV_focus_33_desc: "金融是现代经济的核心。我们将成立越南国家银行，统一货币发行，管理国家外汇储备，调控金融市场，为经济发展提供坚实的金融保障。"

DRV_focus_34: "河内建设计划"
DRV_focus_34_desc: "河内是越南的首都，必须建设成为一座现代化的大都市。我们将制定河内建设计划，修建现代化的道路、桥梁、供水供电系统，让河内成为东南亚的一颗明珠。"

DRV_focus_35: "铁路贯通计划"
DRV_focus_35_desc: "铁路是经济发展的命脉。我们将制定铁路贯通计划，修建连接南北的铁路干线，打通内陆与沿海的交通动脉，促进物资流通和经济发展。"

DRV_focus_36: "取缔帮长制度"
DRV_focus_36_desc: "黑帮势力危害社会秩序，必须予以坚决打击。我们将取缔一切帮派组织，严惩帮派头目，还社会一个安定和谐的环境。"

DRV_focus_37: "中越企业公司"
DRV_focus_37_desc: "两国企业合作是互利共赢的重要途径。我们将成立中越合资企业，引入中国资本和技术，带动越南经济发展，创造就业机会。"

DRV_focus_38: "华商经营特权"
DRV_focus_38_desc: "华侨商人在越南经济发展中发挥着重要作用。我们将给予华侨商人经营特权，鼓励他们投资兴业，促进商业繁荣。"

DRV_focus_39: "建立中山学院"
DRV_focus_39_desc: "教育是国家发展的根本。我们将建立中山学院，培养高级人才，引进先进科技，为国家现代化建设提供智力支持。"

DRV_focus_40: "开设汉文报馆"
DRV_focus_40_desc: "媒体是舆论的阵地。我们将开设汉文报馆，传播政府声音，宣传政策法令，引导社会舆论，弘扬爱国主义精神。"

DRV_focus_41: "建设中国驻越专署"
DRV_focus_41_desc: "中国外交代表机构的设立标志着两国关系的深化。我们将为中华人民共和国驻越南大使馆建设专门的馆舍，为两国政府交往提供便利。"

DRV_focus_42: "筹设兵工厂"
DRV_focus_42_desc: "自主的军事工业是国防独立的保障。我们将在河内和西贡建立大型兵工厂，自主生产枪械、火炮、弹药等武器装备，逐步实现国防装备的自给自足。"



