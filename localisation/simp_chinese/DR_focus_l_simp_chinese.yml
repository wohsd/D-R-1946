CHI_focus_political_7: "有限的门户开放"
CHI_focus_political_7_desc: "虽然有限的门户开放政策时常遭受党内右派的批评，他们认为不过是另一种模式的“闭关锁国”。但现实很清楚，一旦全球经济危机来临，我们将无法独善其身。"

