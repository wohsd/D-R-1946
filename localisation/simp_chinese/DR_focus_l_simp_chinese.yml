# 越南帝国国策
VIN_focus_1: "越南帝国独立宣言"
VIN_focus_1_desc: "1945年3月11日，保大帝宣布越南脱离法国殖民统治，建立越南帝国，加入大东亚共荣圈。这是越南走向独立的历史性一步。"
VIN_focus_2: "临时政府组建"
VIN_focus_2_desc: "组建以保大帝为首的临时政府，任命各部首长，建立基本的行政体系，确保国家机器正常运转。"
VIN_focus_3: "国民大会筹备"
VIN_focus_3_desc: "筹备召开国民大会，制定新宪法，确立国家的基本政治制度，为越南的未来发展奠定基础。"
VIN_focus_4: "政治整合运动"
VIN_focus_4_desc: "整合各个政治派别，消除内部矛盾，建立统一战线，共同致力于国家的独立和发展。"
VIN_focus_5: "军事重整计划"
VIN_focus_5_desc: "整编现有武装力量，组建正规军，建立军事指挥体系，训练军官和士兵，提升军队战斗力。"
VIN_focus_6: "经济重建纲要"
VIN_focus_6_desc: "制定经济重建计划，恢复农业生产，发展工业，改善交通基础设施，促进经济复苏和发展。"
VIN_focus_7: "皇道精神宣扬"
VIN_focus_7_desc: "宣扬皇道精神，增强民族自豪感和凝聚力，号召人民团结在保大帝周围，共同建设新越南。"
VIN_focus_8: "海军建设规划"
VIN_focus_8_desc: "规划海军建设，建立海防体系，保护沿海安全，维护海上权益，为越南的发展提供安全保障。"
VIN_focus_9: "工业振兴方案"
VIN_focus_9_desc: "振兴工业，建立基础工业体系，发展轻工业和重工业，提高越南的工业自给能力。"
VIN_focus_10: "交通设施改善"
VIN_focus_10_desc: "改善交通设施，修建公路、铁路、桥梁，打通南北交通动脉，促进物资流通和经济发展。"
VIN_focus_11: "农村改革试点"
VIN_focus_11_desc: "在部分地区试点农村改革，改善农民生活，提高农业生产积极性，促进农村经济发展。"
VIN_focus_12: "陆军现代化"
VIN_focus_12_desc: "推进陆军现代化，更新装备，改进训练，提高陆军的作战能力和现代化水平。"
VIN_focus_13: "商业振兴政策"
VIN_focus_13_desc: "制定商业振兴政策，鼓励商业发展，活跃市场，促进贸易，提高人民生活水平。"
VIN_focus_14: "教育发展计划"
VIN_focus_14_desc: "制定教育发展计划，建立学校体系，培养人才，提高国民素质，为国家发展提供智力支持。"
VIN_focus_15: "国家防卫强化"
VIN_focus_15_desc: "强化国家防卫体系，建立国防工业，加强军事训练，确保国家的安全和主权。"
VIN_focus_16: "经济自给自足"
VIN_focus_16_desc: "实现经济自给自足，减少对外依赖，建立独立的经济体系，保障国家的经济安全。"
VIN_focus_17: "越南帝国的未来"
VIN_focus_17_desc: "展望越南帝国的美好未来，号召全体国民团结奋斗，共同建设一个独立、自由、繁荣的新越南。"

VIN_focus_18: "皇道政治确立"
VIN_focus_18_desc: "确立以保大帝为核心的皇道政治体系，巩固皇室权威，建立稳定的政治秩序，确保国家的长治久安。"

VIN_focus_19: "基础设施建设"
VIN_focus_19_desc: "大力建设基础设施，修复战争破坏的道路、桥梁、港口，改善交通条件，促进经济发展。"

VIN_focus_20: "农业复兴计划"
VIN_focus_20_desc: "制定农业复兴计划，恢复农业生产，提高粮食产量，改善农民生活，确保粮食安全。"

VIN_focus_21: "工业体系建立"
VIN_focus_21_desc: "建立基础工业体系，发展轻工业和农产品加工业，提高越南的工业基础。"

VIN_focus_22: "军队现代化"
VIN_focus_22_desc: "推进军队现代化，建立现代化的军事指挥体系，训练现代化的军队。"

VIN_focus_23: "国防工业起步"
VIN_focus_23_desc: "建设国防工业，建立军事工厂，生产武器装备，逐步实现军事自给。"

VIN_focus_24: "海防体系构建"
VIN_focus_24_desc: "构建海防体系，建设海军和陆军协同作战，保护沿海安全。"

VIN_focus_25: "经济自主发展"
VIN_focus_25_desc: "发展经济自主，减少对外依赖，建立独立的经济体系。"

VIN_focus_26: "陆军建设强化"
VIN_focus_26_desc: "强化陆军建设，提高陆军战斗力，确保国家领土安全。"

VIN_focus_27: "越南帝国建设"
VIN_focus_27_desc: "全面推进越南帝国的建设，实现政治、经济、军事全面发展，建设一个强大的新越南。"


VIN_focus_28: "大东亚共荣圈参与"
VIN_focus_28_desc: "积极参与大东亚共荣圈建设，与日本等亚洲国家合作，共同建设繁荣的亚洲。"

VIN_focus_29: "与日本合作深化"
VIN_focus_29_desc: "深化与日本的合作，在政治、经济、军事等领域开展全面合作，共同发展。"

VIN_focus_30: "与东南亚国家友好"
VIN_focus_30_desc: "与东南亚国家建立友好关系，发展经贸往来，促进地区和平与稳定。"

VIN_focus_31: "区域合作机制建立"
VIN_focus_31_desc: "建立区域合作机制，与周边国家加强合作，共同应对挑战，实现共同发展。"

VIN_focus_32: "东南亚联盟构想"
VIN_focus_32_desc: "提出东南亚联盟构想，旨在建立一个由越南领导的区域性组织，促进东南亚各国的政治、经济、军事合作与协调。"

VIN_focus_33: "联盟外交攻势"
VIN_focus_33_desc: "积极开展联盟外交，与东南亚各国建立外交关系，争取各国支持东南亚联盟构想，扩大越南在地区的影响力。"

VIN_focus_34: "经济一体化计划"
VIN_focus_34_desc: "推动区域经济一体化，建立自由贸易区，促进商品、资本、人员的自由流动，实现区域经济共同发展。"

VIN_focus_35: "东南亚联盟成立"
VIN_focus_35_desc: "正式宣布东南亚联盟成立，越南作为创始成员国和核心领导者，将引领东南亚各国走向共同繁荣和安全。"

VIN_focus_40: "农业基础设施建设"
VIN_focus_40_desc: "加强农村基础设施建设，改善农田灌溉系统，修建农村道路，提高农业生产条件。"

VIN_focus_41: "农业政策改革"
VIN_focus_41_desc: "推行农业政策改革，减免农民税收，提供农业贷款支持，提高农民生产积极性。"

VIN_focus_42: "粮食安全保障"
VIN_focus_42_desc: "建立粮食储备系统，提高粮食生产能力，确保国家粮食安全和供应稳定。"

VIN_focus_43: "农业技术推广"
VIN_focus_43_desc: "推广现代农业技术，引进优良品种，提高农业生产效率和农产品质量。"

VIN_focus_44: "农产品加工发展"
VIN_focus_44_desc: "发展农产品加工业，提高农产品附加值，增加农民收入，促进农业现代化。"

VIN_focus_45: "农村合作社建设"
VIN_focus_45_desc: "建设农村合作社，组织农民集体生产，提高农业产业化水平和抗风险能力。"

VIN_focus_46: "农业现代化完成"
VIN_focus_46_desc: "全面实现农业现代化，建立完善的农业生产体系，确保粮食安全，促进农村经济发展。"

VIN_focus_47: "军事指挥系统建立"
VIN_focus_47_desc: "建立现代化军事指挥系统，完善指挥体系，提高军队指挥效率和作战能力。"

VIN_focus_48: "军队训练改革"
VIN_focus_48_desc: "推行军事训练改革，加强实战化训练，提高军队战斗力和协同作战能力。"

VIN_focus_49: "军工体系建设"
VIN_focus_49_desc: "建设军事工业体系，自主生产武器装备，减少对外依赖，提高国防自主能力。"

VIN_focus_50: "军事人才培养"
VIN_focus_50_desc: "建立军事院校体系，培养高素质军事人才，加强军官队伍建设，提高军队整体素质。"

VIN_focus_51: "陆军现代化升级"
VIN_focus_51_desc: "推进陆军现代化，更新武器装备，加强机械化建设，提高陆军作战能力。"

VIN_focus_52: "海军海防强化"
VIN_focus_52_desc: "强化海防体系，建设海军力量，保护领海安全，维护海洋权益。"

VIN_focus_53: "军事现代化完成"
VIN_focus_53_desc: "全面实现军事现代化，建立强大国防力量，确保国家安全，维护国家主权。"

VIN_focus_36: "工业化战略升级"
VIN_focus_36_desc: "实施工业化战略升级，整合现有工业资源，优化产业布局，提升工业产能和效率，推动越南从农业国向工业国转型。"

VIN_focus_37: "轻工业发展计划"
VIN_focus_37_desc: "重点发展轻工业，包括纺织、食品加工、制糖、造纸等民生产业，满足国内市场需求，提高人民生活水平。"

VIN_focus_38: "重工业建设工程"
VIN_focus_38_desc: "推进重工业建设，建设钢铁厂、机械厂、化工厂等基础工业设施，为国防和经济发展提供坚实支撑。"

VIN_focus_39: "越南工业体系建成"
VIN_focus_39_desc: "完成越南工业体系建设，形成完整的工业产业链，实现工业自主发展，奠定越南现代化建设的坚实基础。"