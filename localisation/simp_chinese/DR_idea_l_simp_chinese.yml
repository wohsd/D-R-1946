l_simp_chinese:
 JAP_Yoshida_faction_staff:0 "吉田派幕僚"
 JAP_Yoshida_faction_staff_desc:0 "吉田茂在任内大量培养了自己的党羽，政府各职能都和吉田茂有着深刻交情，如果想要继续推进改革，必须瓦解吉田派。"
 JAP_Constitutional_Norm_Thirty_Years:0 "宪政常道三十年"
 JAP_Constitutional_Norm_Thirty_Years_desc:0 "自1909年的原敬内阁以来，日本已经度过了长达30年的民主化历程，期间虽经历“协力内阁”与“军纵提携”体制，然宪政常道体制到如今已然无人能够撼动。过去板垣退助等民权斗士的理想在如今已然实现。"
 JAP_Toranomon_Spirit:0 "虎之门殇"
 JAP_Toranomon_Spirit_desc:0 "1923年，帝国的继承人、皇太子裕仁在虎之门横死街头，后续继任的山本权兵卫元老内阁根据前一届内阁的《治安维持法》大肆清洗不稳定因素，而这种政治民主与社会高压并行的体制已然并行三十多年，过去维系宪政体制的《治安维持法》也成为了执政者肆意打击其他政党的工具。"
### 优化要点"

 JAP_Members_Co_Prosperity_Sphere:0 "共荣圈成员"
 JAP_Members_Co_Prosperity_Sphere_desc:0 "共荣圈，全称大东亚共荣圈。是日本帝国倡议的一项政治和军事的深度联盟，通过“大东亚省”统筹殖民事务。日本提出建立“东亚新秩序”的口号，要求东亚各国自觉协同日本，为东洋文化复兴，使东洋文化达到傲视西洋文化的程度而建成以“大东亚共荣圈”为背景的大东亚文化自给自足体。\n\n§H“帝国所期求的是，确保东亚永久之安定，此种新秩序的建设，应以东亚各国合作，在政治、经济、文化等各方面建立连环互助的关系为根本。”§!"
 JAP_Naval_Supremacy:0 "海主陆从"
 JAP_Naval_Supremacy_desc:0 "自日俄战败，山本权兵卫主持海军以来，"海军主，陆军从"的理念已然确立，而这套理念经过"南洋战争"后更是到了无法撼动的地步。"
 JAP_Golden_Age:0 "黄金时代"
 JAP_Golden_Age_desc:0 "得力于南洋战争带来的巨大获利，当前的日本正处在战后高速发展时期，各行各业焕发出不一样的生机，新生科技正在如雨后春笋般冒出，能否从亚洲一流跻身世界一流，就看这十年之期了。"
 
 JAP_Kagoshima_Group:0 "鹿儿岛集团"
 JAP_Kagoshima_Group_desc:0 "鹿儿岛集团"是二三十年代政友会内部主宰中央的床次派系的统称。随着1940年床次竹二郎的离世和金光庸夫的崛起，以前跟着床次共进退的中村嘉寿、原耕及绫部健太郎等人也一同离开鹿儿岛登上政友会舞台的中央。在1942年小川平吉去世后，"鹿儿岛集团"彻底制霸了政友会。到了1946年，虽然"鹿儿岛集团"的影响力因为金光总裁而余威尚在，但随着鸠山的回归以及前田米藏等元老的心态的转向，"鹿儿岛集团"是否还能稳坐钓鱼船，这还要打个问号……"
 JAP_Kagoshima_Group_tooltip:0 "政友会影响力：§H+5%§!"
 JAP_No_Genro_Era:0 "无元老时代的帝国"
 JAP_No_Genro_Era_desc:0 ""元老"本为日本帝国担任首相举荐与各势力协调之任务之人。在立宪之后，元老本有九人，然而到了20世纪20年代，元老仅剩下园公一人。虽后来补位清浦奎吾、原敬、山本权兵卫三人，但到了1942年清浦去世，日本帝国彻底进入了"无元老时代"，后续虽牧野伸显、木户幸一、平沼骐一郎等宫中、枢密院势力尝试代替完成元老举荐工作之补位。但1943年的 "第三次护宪运动"还是彻底将组阁大命的决定权推给了众议院。\n\n宪政常道本就是园公一人的幻想，在无元老时代的无责任帝国，单一依靠众议院和老牌官僚的党人是否能压制其他势力，维系宪政常道，我们只能祝他们好运了……"

 FRA_Burdened_Foreign_Debt:0 "外债缠身"
 FRA_Burdened_Foreign_Debt_desc:0 "战争的阵痛曾让法国的经济一落千丈，虽然战争已过去多年，但法国的通货膨胀如同家常便饭般无时无刻正在影响着全国。"
 FRA_Champagne_Agreement:0 "兰斯停战条约"
 FRA_Champagne_Agreement_desc:0 "战争毁灭了民主联邦，没人能想到法国兵败如山倒，兵败的结果是惨痛的，留给法国民众的只有一地鸡毛，法军不但没有夺回阿尔萨斯-洛林地区，反而使得整片法国东部成为了非军事缓冲区。"
 FRA_Food_crisis:0 "食品危机"
 FRA_Food_crisis_desc:0 "经典的"剪刀危机"正在席卷法国，农民在出售小麦、葡萄酒、牛奶或牛时获得的钱比以前少，但他们必须为工具、化肥、种子、衣服和其他不可或缺的现金支付甚至可能比以前更多。"
 FRA_European_Recovery_Plan:0 "欧洲复兴计划"
 FRA_European_Recovery_Plan_desc:0 "德国向法国提供贷款用于战后重建，法国工业得到恢复，民生得到改善。"

 CHI_Land_Reform:0 "田制改革运动"
 CHI_Land_Reform_desc:0 "田制改革运动是由农业部长毛泽东同志所倡议的一项土地改革行动。主张社会民间推行“国家赎买+合作社经营”模式：地主土地由国家有偿征收，土地以永佃权形式分配给农民。"

 CHI_Triumph_Republican_Constitutionalism:0 "共和宪政之胜"
 CHI_Triumph_Republican_Constitutionalism_desc:0 "中国的历史翻开了崭新的篇章，国民党内部的中左派空前的团结起来，并彻底将右派逐出政坛，接连不断的改革体制，赢得了广泛的民心认同，共和宪政之风依旧沐浴在华夏大地之上。"

 CHI_National_Revolutionary_Army:0 "改革中的国军"
 CHI_National_Revolutionary_Army_desc:0 "尽管我们成功统一了中华，但我们未能及时解决地方各派军队内部的斗争。"

 CHI_Revolutionary_Ally:0 "革命友党"
 CHI_Revolutionary_Ally_desc:0 "革命的胜利永远离不开共产党人，下至基层军队上至政府决策，都有共产党人的身影，国民党和共产党的情谊如同手足之情。"



 ASY_Assyrian_Kingdom:0 "社会军事化"
 ASY_Assyrian_Kingdom_desc:0 "在亚述的古籍中，战神阿淑尔为最高神，战争是神的旨意，军功是神的荣耀。"

 ASY_Assyrian_militarism:0 "亚述帝国精神"
 ASY_Assyrian_militarism_desc:0 "亚述军事精神是古代军国主义的巅峰，其组织、技术、战术、威慑体系深刻影响波斯、希腊、罗马乃至后世军事思想，是 “铁血扩张” 与 “恐怖统治” 的代名词。"






