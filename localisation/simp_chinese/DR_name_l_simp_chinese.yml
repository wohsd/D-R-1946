JAP_Yongren:0 "雍仁"
JAP_Yongren_desc:0 "生于：§H1902年6月25日§!\n势力：§H日本皇族§!\n\n日本皇族，大正天皇与贞明皇后次子，昭和天皇之弟，小名淳宫。年少的时候与裕仁和宣仁共同长大，据说三个人的关系不错。与其兄比起来，是最活泼的一个。\n\n自大哥裕仁身死虎之门事变中，被人称为皇太弟的雍仁自然接过了全日本的权力。和沉默寡言的昭和天皇相比，他在滑雪，橄榄球等项目上大出风头。被称为体育王子，他更受到全体国民的爱戴。他的家庭沙龙是上流贵族子弟的榜样。\n\n但大哥裕仁的过世，令其大受打击。身体健康的他在1940年被诊断出肺结核，到了第二年，回到御殿场疗养，从此基本淡出日本政坛。"


