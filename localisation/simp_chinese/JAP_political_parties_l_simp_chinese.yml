l_simp_chinese:
 # 政党介绍事件
 JAP.political_parties.1.t: "政党政治的活化石"
 JAP.political_parties.1.d: "政友会是日本政治史中历史最悠久、组阁次数最多的政党，其雏形可追溯至伊藤博文组建的立宪政友会。在西园寺公望总裁时代，政友会曾组阁两次，其中最具亮点的是1908～1912年的第五届伊藤博文内阁和伊东巳代治内阁，在第五届伊藤内阁于而后继任的伊东内阁时期期间，其试图以英国为模板构建责任内阁制。而在经历尾崎行雄脱党，西园寺离开政友会后，政友会总裁又移交给了原敬。\n\n第三代总裁原敬在一九一九年组建了日本历史上第二个真正的政党内阁，推行行政改革，开创了“平民宰相”时代。然而在原敬走后，床次竹二郎时代的政友会内部派系斗争极为激烈，先是以横田千之助等为首的二十年代初的政友改造运动，而后又是以铃木喜三郎、鸠山一郎、森恪为首的五三会派崛起，在一九三零年代发动党内政变，裂党组建政友新党，种种因素导致政友会在三十年代一度衰落。\n\n进入一九四零年代，随着政友新党的铃木喜三郎、森恪相继去世，鸠山一郎带领残部回归政友会，此时的总裁已转为金光庸夫，在成功与鸠山联合收拾了中岛知久平的政友革新派后。政友会与民政党联合发起第三次护宪运动，击溃了国协党支持的南次郎军部内阁。一九四三年，政友会与民政党共同入阁，支持八十五岁高龄的尾崎行雄组建联合内阁。一九四五年尾崎辞职后，金光庸夫终于得以组建独立的政友会内阁。直至一九四六年，政友会依然是日本政坛最核心的力量，但其内部派系林立、缺乏强有力领袖的困境始终未解。"
 JAP.political_parties.1.a: "令人惊讶"

 JAP.political_parties.2.t: "宪政常道的春夏秋冬"
 JAP.political_parties.2.d: "民政党的源头可追溯至宪政本党，以及从政友会政友会分裂出来的国民宪政党等反政友会势力。一九一二年，犬养毅与尾崎行雄从宪政本党和政友会中分裂出来，组建国民宪政党，发起了反藩阀、反贵族院的第一次护宪运动，成功斗垮伊东已代治内阁，并短暂组建联合内阁。然而"西门子案”丑闻爆发后，贵族院反扑，国民宪政党受挫。\n\n在第二次护宪运动后，国民宪政党部分党人并入宪政本党，促使其改组为更强大的民政党。民政党与政友会形成两大政党对峙格局，交替执政。一九二六年，安达谦藏与床次竹二郎的联立内阁期间，民政党正式确立其地位，并推动了普选法的实施。一九二七年，民政党支持的江木翼组阁，在迅速打赢日英战争后，以内阁总辞职的方式完成政治过渡。\n\n一九三零年代后期，面对军部势力抬头和宇垣一成的新党运动，民政党一度陷入分裂，川崎克、安达谦藏、山道囊一等反主流派脱离民政党参与组建国协党。但民政党本体并未解散，在经历一系列动荡后，总裁职位移交给了年轻的斋藤隆夫。一九四三年，民政党与政友会摒弃前嫌，共同支持尾崎行雄组建联合内阁，并在1945年尾崎辞职后继续作为政坛两大支柱之一存在。民政党始终代表着城市工商业者和改革派知识分子的利益，其命运与日本政党政治的兴衰紧密相连。"
 JAP.political_parties.2.a: "有意思的大党"

 JAP.political_parties.3.t: "时代的弃子"
 JAP.political_parties.3.d: "国协党是一个短暂但富有意义的政党，其苗条最早可以追溯到二十年代末的"拥立宇垣运动"。而在一九三八年宇垣一成奉元老之命组阁后，国协党随着既成政党反主流派试图配合军部改造政党政治的尝试。该党的核心发起人是民政党反主流派领袖川崎克、安达谦藏，以及政友会的中岛知久平等人。他们的计划是拆散既有的政友会和民政党，吸收两党的脱党者，组建一个以"国民协同"为理念、奉行国家统制经济路线的政权党，以取代传统的政党组织。最终在宇垣一成内阁的支持下，国协党迅速组建，并在议会中获得了与民政党相当的席位。\n\n然而，国协党的根基极不牢固。政友会与民政党两大党并未如预期般自行解散，反而在经历短暂动荡后重新整合。而成立的国协党相比既成政党更像是东拼西凑的政治联盟，缺乏统一的纲领和基层网络。宇垣一成对国协党的表现颇感失望，最终放弃维系内阁。川崎克并未死心，又转而支持同为宇垣阀的南次郎组阁，试图延续国协党的政治生命。\n\n南次郎内阁时期，国协党一度继续执政，但随着政友会与民政党卷土重来，联合发动第三次护宪运动。南次郎内阁被击溃，国协党也随之落寞。而安达谦藏、川崎克等曾经的巨头如今也已迟暮，国协党的生与死，已然命悬一线。"
 JAP.political_parties.3.a: "他们还有什么存在必要吗？"

 JAP.political_parties.4.t: "畸形体制下的怪胎"
 JAP.political_parties.4.d: "社大党的源头可追溯至一九二零年代，随着普选运动高涨和劳工运动复兴，无产政党重新集结。一九二六年《治安维持法》颁布后，合法左翼政党的生存空间极为狭窄，但工会组织和农会运动仍在地下与半地下状态中持续发展。一九三二年，在劳农党、无产党等系统的基础上，社会大众党正式成立，成为战前最大的无产阶级政党。该党以"议会内的阶级斗争"为口号，主张通过合法选举改善劳工与农民阶级的处境，社大党在一九三零年代的议会中拥有少量议席，虽无法与政友会、民政党两大党抗衡，却能以关键少数姿态影响特定议案。\n\n到了三十年代末，社大党开始出现极为明显的右转，该党重要领导人麻生久、龟井贯一郎开始试图改造社大党，使其法西斯化，并在一九三八至一九四三年坚定支持宇垣一成与南次郎两届军部内阁。\n\n第三次护宪运动后，浅沼、龟井等人的地位也逐渐松动，原有的以片山哲老牌社会主义者在麻生久死后后来居上，挑战龟井等人的总裁地位。到了如今的1946年，社大党已然成为了一个自身逻辑混乱，议会席位可有可无的小党，社大党的未来，没有任何人能看透。"
 JAP.political_parties.4.a: "惋惜不已"

 JAP.political_parties.5.t: "金光与鸠山的会谈"
 JAP.political_parties.5.d: "暮色从窗外渗进来，将室内的光线压得很低。金光庸夫坐在炭火盆旁，手中的铁筷拨了拨炭灰，几点火星跳起，又迅速熄灭。对面的鸠山一郎端坐如石，目光落在盆中暗红色的炭火上，良久不语。\n\n最终还是金光先开了口："鸠山君，南次郎倒台那会儿，你带着政友新党的人回来，我就说过，这屋子永远有你一席。"\n\n鸠山的嘴角微微动了一下，说不清是笑还是自嘲："金光君，你这话说得太客气了。当年我跟着铃木、跟着森恪裂党而出，搞什么政友新党，到头来呢？森恪死了，铃木也死了，剩下我一个孤家寡人，灰溜溜地回来。换作我是你，未必会开门。"\n\n金光放下铁筷，端起茶杯抿了一口，茶已经凉了："政坛这碗饭，吃了几十年，谁没走过弯路？原敬前辈当年被选为元老，自己都没想到。床次总裁在樱田门事变里摔得那么惨，最后不也是我替他收拾的残局？"他顿了顿，"我跟你说句实在话，政友会现在缺的不是总裁，是能干活的人。你回来，我不觉得丢人，我觉得踏实。"\n\n鸠山沉默了片刻，抬起眼看他："金光君，你这个人……说实话，我以前觉得你没什么魄力。床次死后，你接手政友会，我以为你也就是个过渡。南次郎那几年，你带着政友会忍气吞声，我甚至在那边替你觉得憋屈。"\n\n"那你怎么还回来了？"金光随即逼问道，\n\n鸠山被这句话堵了一下，随即苦笑道："因为后来我想明白了。你忍，不是因为你怕。你是等着我和民政党那帮人都折腾累了，再出来收拾局面。第三次护宪运动，你和斋藤隆夫联手，一下子就把南次郎掀翻了。那一手，我服。"\n\n金光没有接话，只是又往炭火盆里添了一块炭。炭火发出细微的噼啪声。许久说道："
 JAP.political_parties.5.a: "欢迎回归立宪政友会"

 JAP.political_parties.6.t: "川崎克隐退，大麻唯男登台亮相"
 JAP.political_parties.6.d: "近期，国协党总裁川崎克以年事已高为由宣布隐退，而在安达谦藏、中岛知久平等大佬拒绝接任后，总裁职位便被交给了新生党人川崎克。\n\n作为1939年"宇垣新党运动"的产物，国协党自1943年南次郎内阁垮台以来便一蹶不振直到今天。如今上任的大麻，不仅要面对众议院的绝对劣势情况，还要应付国协党内以久原房之助为首的前政友会反主流的攻击。但大麻也表示，他有信心带领国协党渡过难关。"
 JAP.political_parties.6.a: "祝他好运"

 JAP.political_parties.7.t: "南洋特别大本营成立"
 JAP.political_parties.7.d: "在越南危机白热化之后，金光内阁于近期突然宣布将组建南洋特别大本营以解决越南危机，海军将领米内光政与陆军将领小矶国昭将共同出任大本营最高指挥。\n\n长期以来，日本帝国陆海军都处于长期不对付的状态，而此点自1927年南洋战争后更是如此，大本营的成立，标志着日本帝国陆海军首次放下成见，协力处理危机。"
 JAP.political_parties.7.a: "让我们共赴难关"

 JAP.political_parties.8.t: "众议院的胜利"
 JAP.political_parties.8.d: "近期，众议院通过了一项特别的临时年度预算追加案，允许从年度我们增加年度预算以应对越南问题的军事开支，作为经费的补齐，众议院也同意进行临时征税以缓解财政压力。"
 JAP.political_parties.8.a: "同意"
