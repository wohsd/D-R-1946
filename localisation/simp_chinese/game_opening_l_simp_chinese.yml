JAP_jie_shao: "§Y日俄巨变§!\n\n一九零五年深秋，旅顺港硝烟散去，日本未等来对俄胜利。俄国远东舰队虽受创，但日本联合舰队损失惨重；奉天会战中§O大山岩§!的满州军未能突破俄军防线，双方消耗战。最终日本战败，朝鲜中立，俄国势力进入朝鲜半岛。消息传回东京，举国哗然。战败阴影与四亿日元财政赤字交织，引爆§G日比谷烧打事件§!。民众焚烧与政府关系密切的商店，§O桂太郎§!被迫下台，结束了第一个"§G长州藩§!"时代。\n\n§Y桂园体制的瓦解§!\n\n接替§O桂太郎§!的是§B政友会§!总裁§O西园寺公望§!。他推行§G税制改革§!，却触动地主利益。一九零七年，§O河野广中§!发起的"§G反三税暴动§!"席卷东北和九州，西园寺内阁倒台。随后§O桂太郎§!卷土重来，但第二届内阁仅维持数月，便在一九零八年因遇刺受伤而辞职。长州藩的黄金时代至此走到尽头。\n\n§Y明治体制的修正§!\n\n一九零八年，§O伊藤博文§!组建第五届、也是最后一届内阁。他试图以§B政友会§!联合§D贵族院§!构建超稳定结构，并通过修宪将无责任内阁改为责任内阁，但随后因削减师团触怒军部，陆相§O上原勇作§!动用上奏权倒阁。接替他的§O伊东已代治§!继续推进裁军与修宪计划，然而§B政友会§!此时面临全新挑战：从§W宪政本党§!和§B政友会§!中分裂出的§O犬养毅§!、§O尾崎行雄§!组成"§B国民宪政党§!"。一九一二年，§B国民宪政党§!对伊东内阁的攻击演化为反藩阀、反§D贵族院§!的"§G护宪运动§!"，§O伊东已代治§!被斗垮，取而代之的是§O尾崎行雄§!与§O犬养毅§!的联合内阁。两位民权老将修改选举法。两年后，"§G西门子案§!"丑闻被捅出，§D贵族院§!趁机倒阁，推举山县阀"四天王"之一的§O平田东助§!接任。\n\n§Y贵族院迟暮§!\n\n§O平田东助§!的§D贵族院§!内阁平稳五年，完成对俄朝鲜问题谈判，解决长期经济萧条。但当§B政友会§!在议会发起不信任案时，§O平田东助§!选择辞职，而非与政党彻底决裂。这标志着§D贵族院§!单独组阁的能力已走到尽头，政党政治时代真正来临。\n\n§Y宪政常道§!\n\n§O原敬§!在一九一九年组建日本历史上第二个真正的政党内阁。这位"§G平民宰相§!"推行行政改革，却在一九二二年因一个奇特原因主动辞职——他被选为§O山县有朋§!死后的替补元老，这一"升级"使他不得不离开首相之位。\n\n§Y两党角逐时代§!\n\n接替§O原敬§!的是§B政友会§!五代目总裁§O床次竹二郎§!，但他的内阁随后因"§G虎之门事件§!"而倒台。皇太子死后，§O山本权兵卫§!组建海军超然内阁以稳定局面，此举激怒§W宪政本党§!与§B政友会§!。山本内阁因§G第二次护宪运动§!垮台。一九二六年，§O安达谦藏§!与§O床次竹二郎§!、§O犬养毅§!组建第二个联立内阁，实现男子普选与中选举区改革。同时，§B国民宪政党§!解散，部分党人并入§W宪政本党§!，§W宪政本党§!改组为§B民政党§!。联立内阁因§G进军越南§!引发日英外交危机而倒台。随后，§B民政党§!支持的§O江木翼§!内阁成立，日本迅速打赢日英战争，雪耻日俄国仇。战争结束，§O江木翼§!内阁总辞职。组阁大命再次落到§B政友会§!的床次手中。\n\n§Y政友新党崛起§!\n\n但第二次§O床次竹二郎§!内阁陷入本党团结危机：§B政友会§!内部的§R五三会§!（§O铃木喜三郎§!、§O鸠山一郎§!及§O森恪§!为首）计划篡夺总裁职位。最终在§O森恪§!阴谋下，床次内阁因一九三二年§O雍仁§!天皇遇刺未遂的"§G樱田门事变§!"倒台。随后§O铃木喜三郎§!等人断然裂党，组建政友新党，并推举铃木盟友§O平沼岐一郎§!组阁。但§O平沼岐一郎§!很快被踢开，§O铃木喜三郎§!自行组建独立的政友新党内阁。\n\n§Y军政提携体制§!\n\n在政友新党同僚扶助下，§O铃木喜三郎§!登上首相之位。然而一九三八年，一场由青年军官发动的"二二七事变"暴力政变把§O铃木喜三郎§!与前总裁及元老§O原敬§!一并送下黄泉。政变虽被镇压，但元老集团不再愿选党人组阁。万般无奈，§O西园寺§!等人推举军部出身的§O宇垣一成§!组阁。持续近十年的"§G军政提携§!"准法西斯体制从此开始。\n\n§Y宇垣新党运动§!\n\n§O宇垣一成§!组阁后，其他政党的反主流派也开始活跃。以§O川崎克§!、§O中岛知久平§!为首的既成政党反主流派试图拆散既有政党，组建"§G国民协同§!"性质的党。但行动最终失败——两大党并未解散，东拼西凑的"§R国协党§!"也仅勉强与§B民政党§!席位齐平。§O宇垣一成§!放弃维系内阁，而§R国协党§!总裁§O川崎克§!继续支持同为宇垣阀的§O南次郎§!内阁。\n\n§Y第三次护宪运动§!\n\n到了§O南次郎§!内阁时代，§R国协党§!的好日子走到头。§B政友会§!方面，政友新党在§O森恪§!与§O铃木喜三郎§!相继去世后日渐衰落，§O鸠山一郎§!不得不带着剩下的人回到床次死后以§O金光庸夫§!为首的§B政友会§!。§B民政党§!方面，总裁职位移交年轻的§O斋藤隆夫§!。曾经因宇垣新党运动而被折腾的§B政友会§!与§B民政党§!卷土重来，联合发动"§G第三次护宪运动§!"，击溃§O南次郎§!内阁。至此，持续八年的"§G军政提携体制§!"彻底进入历史垃圾堆。\n\n§Y宪政复兴§!\n\n一九四三年，八十五岁高龄的§O尾崎行雄§!再度出山，组建由§B政友会§!与§B民政党§!共同入阁的第二次尾崎内阁。完成历史使命后，于一九四五年以年事过高自行总辞职。尾崎走后，§B政友会§!的§O金光庸夫§!组建独立内阁。\n\n转眼间，日出之国已走到一九四六年。"

CHI_jie_shao: "§O南北议和§!\n\n辛亥年的战火硝烟仿佛已渐渐消散多年，那些曾经为革命出生入死、浴血奋战的§O同盟会§!元老们，如今已然以§B国民党§!议员的身份端坐在§O国会§!殿堂之上，用全新的方式为中华大地的发展贡献力量。然而，并非所有曾一同投身革命的同志，都对眼前的这般现状心满意足。\n\n自§O辛亥革命§!在§R英国§!的调停之下实现§O南北议和§!以来，§B国民党§!便以南方各省为根基，马不停蹄地开展组织建设工作。§O宋教仁§!着手改组同盟会之后，新生的§B国民党§!在他的引领下，将核心精力悉数投入到§O国会§!选举的筹备之中。凭借着先进明晰的政治纲领，以及党内成员们在革命历程中积累的崇高威望，§B国民党§!接连在多次§O国会§!选举中摘得第一大党的桂冠，并顺理成章地牵头组建内阁。尽管在南北双方的政治妥协之下，§O宋教仁§!未能推动"§O完全由多数党组阁§!"的决议落地，但§B国民党§!依旧如同一颗璀璨的新星，在民国初年的政治舞台上绽放出最为耀眼的光芒。\n\n§O党内纷争§!\n\n然而，在一派§H兴盛景象§!的背后，危机早已悄然潜伏。党派之间的利益纷争、新旧思想的激烈碰撞、中央与地方的权力博弈等诸多问题相互纠缠、错综复杂，让民国政府在施政过程中处处碰壁、左支右绌。议会、政府、军队，各个机构不同派系之间彼此掣肘、相互倾轧，致使§O辛亥革命§!时期向广大民众许下的美好诺言，至今仍如空中楼阁般遥不可及。即便在选举时信誓旦旦提出的政纲，真正能够得到推行和落实的，也不过寥寥数项。在这样的困局之下，§B国民党§!内外反对的声愈发强烈。\n\n党内的§R左派§!力量，依托着兴中会时期便已建立的深厚革命情谊。然而，迟迟未能在议会通过的§G土地改革§!议案，正一点点消磨着他们的耐心与热情。右派势力尽管依旧对于中央保持支持，但他们同样对§B国民党§!中央在政治博弈中的软弱妥协深感不满，呼吁建立起一个更加强力的"§B国民党§!"组织。\n\n§O一九四六年的中国§!\n\n在各方漩涡的核心——南京，在左右派的妥协下，谭平山凭借着自身威望维持着§B国民党§!地方力量的团结。但日益严峻的§R财政危机§!，以及东方邻居日益雄起的野心，正在威胁中国崛起的决心。"

JAP_lu_xian_zhi_nan: "§Y一九四六年·日本的十字路口§!\n\n第二次尾崎内阁总辞职后，§B政友会§!的§O金光庸夫§!成为新一任总理。这位在第三次护宪运动中率众打垮§O南次郎§!军政提携体制的老政治家，如今要面对的是：\n\n· 刚刚恢复的§Y宪政§!还很脆弱\n· §R军部§!虽被打退但仍有实力\n· §D国会§!席位分散（见下表）\n· 人民在经历了十年§G军政提携§!的准法西斯恐怖后，对政党政治既渴望又怀疑\n\n你要带日本§G往哪走§!？\n\n§Y━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━§!\n\n§D开局国会席位现状§!\n\n§B政友会§!（金光庸夫·立宪保守） §G206席§!\n§W民政党§!（斋藤隆夫·自由宪政） §G106席§!\n§R社会党§!（左派·劳动派） §G83席§!\n§G共产党§!（革命派） §G20席§!\n无所属/贵族院 §G30席§!\n\n§Y━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━§!\n\n§B§l§l§I路线一·民主宪政§!§!\n\n§Y意识形态：democratic§!（保守/自由）\n\n§B国策树入口§!：§Y金光庸夫阁下的任期§! → §Y政友会的回归§!（JAP_focus_9）\n\n§B三个关键分歧§!：\n\n§G分歧1§!：五三会叛乱\n§B政友会§!内部§R五三会§!（鸠山一郎派）不满金光庸夫的温和路线。走这条线，你必须在§Y安抚回归的鸠山派§!（JAP_focus_18）和§Y打击其他三党选区§!（JAP_focus_17）之间选一个。安抚可以保住党团结，但会让保守党席位停滞；打击能快速拉选区，但可能触发§G五三会叛乱§!事件（鸠山带着一批党员出走，议席暴跌40）\n\n§G分歧2§!：贵族院合作\n§D贵族院§!是宪政体制里的定时炸弹——他们掌握30席无所属，在关键时刻可以决定法案是否通过。§O尾崎行雄§!第二次内阁能撑住，全靠贵族院不捣乱。你的§Y争取传统贵族院的支持§!（JAP_focus_16）国策就是解决这个的。如果搞不好，§D贵族院§!可能联合军部搞"§G天皇下诏解散议会§!"，直接终结宪政\n\n§G分歧3§!：经济路线\n§Y一揽子经济计划§!（JAP_focus_10）下的两个分支：\n  - §Y扩大商品保险覆盖面§!（JAP_focus_11）→ 社会福利/民生派（金光庸夫本人倾向）\n  - §Y南洋峰会§!（JAP_focus_12）→ 南洋扩张/重工业派\n选福利派：稳定度+，但经济增长慢；选扩张派：经济爆长，但会触发§R南洋殖民冲突§!事件链\n\n§B最终走向§!：§Y宪政常道§!——一个和平崛起的民主日本，但会和§R社会党§!/§G共产党§!/§R军部§!/§D贵族院§!持续斗争\n\n§B风险§!：连续2年法案过不了→§R军部干预§!事件→内阁倒台→重新走上军政提携老路\n\n§Y━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━§!\n\n§R§l§l§F路线二·法西斯总体战§!§!\n\n§Y意识形态：fascism§!\n\n§B国策树入口§!：§Y金光庸夫阁下的任期§! → §Y帝国军改§!（JAP_focus_19）\n\n§B关键分歧§!：\n\n§G分歧1§!：修宪门槛\n§Y帝国军改§!线的核心瓶颈是——§B征兵法案§!（234席）和§B种族政策§!（310席）、§B公共管控§!（310席）需要修宪才能通过。修宪需要§Y310席§!（全议会三分之二），开局根本够不着。\n\n两种解法：\n  §Y解法A§!：先花48月等下一次议会选举（§B政友会§!+§W民政党§!连立后=312席，刚好破310）\n  §Y解法B§!：搞议会暴动（解散议会→紧急选举→军队施压拉票，代价是稳定度-50）\n\n§G分歧2§!：统合派阀整肃\n§Y统合派阀整肃§!（JAP_focus_30）是总体战路线的关键分叉点：\n  - 清洗宇垣一成旧部→快速控制军部，但陆军派系会反叛\n  - 与宇垣旧部合作→陆军团结，但军令部权力坐大\n\n§B最终走向§!：§Y总体战体制§!——1930年代军政提携的加强版，能打多线战争，但稳定度低、经济崩溃\n\n§B风险§!：§Y连续扩张§!触发§R美英中联合干涉§!事件链（日英战争重演+美国石油禁运）\n\n§Y━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━§!\n\n§B§l§l§N路线三·越南扩张§!§!\n\n§Y意识形态：neutrality§!（初期）→ 取决于后续国策\n\n§B国策树入口§!：§Y金光庸夫阁下的任期§! → §Y越南危机§!（JAP_focus_2）\n\n§B关键分歧§!：\n\n§G分歧1§!：宣战方式\n§Y众议院特别战争预算§!（JAP_focus_3）后三选一：\n  §Y送出旧装备§!：经济代价小，省产能，但傀儡军弱\n  §Y训练越南傀儡军队§!：消耗产能但傀儡能扛线\n  §Y大轰炸§!：立刻对国民政府开战，风险最大但收益最快\n\n§G分歧2§!：战后路线\n  §Y威胁国民政府§!（JAP_focus_7）→ 对华施压，可能逼签《日华共同防御条约》（割让华北主权），但触发中国全面抗战\n  §Y渗透清剿计划§!（JAP_focus_8）→ 持久战，慢慢吞并，消耗人力但稳定\n\n§B最终走向§!：如果走得好是§B中性扩张主义§!（日本成为东南亚霸主），走不好就是§R日英战争重演§!（英国+荷兰+法国殖民军联合介入）\n\n§B风险§!：§Y进军越南§!历史上真的在本世界线引发§G日英外交危机§!——英国可能直接对日本开战\n\n§Y━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━§!\n\n§W§l§l§G路线四·海洋战略·中立派§!§!\n\n§Y意识形态：democratic§!（自由/保守）或 neutrality§!\n\n§B国策树入口§!：§Y金光庸夫阁下的任期§! → §Y海洋战略调整§!（JAP_focus_32）\n\n§B关键分歧§!：\n\n§G分歧1§!：太平洋防御 vs 南洋开发\n  §Y太平洋防御圈§!（JAP_focus_34）→ 防守型：加强太平洋海军+岛屿要塞，不和任何人冲突，但也没扩张\n  §Y南洋资源开发§!（JAP_focus_35）→ 进攻型：开采荷属东印度石油/马来亚橡胶，经济爆长但触发和荷兰/英国的殖民冲突\n\n§G分歧2§!：配合政友会还是单走\n如果同时走路线一的§Y南洋峰会§!（JAP_focus_12），峰会能拉南洋小国中立，南洋开发阻力骤减。如果单走路线四，直接搞殖民开发会被§R荷兰殖民当局§!和§R英国海军§!联合抵制\n\n§B最终走向§!：§W和平大国§!——日本不搞陆上扩张，靠经济和海军成为1946后世界第四强国。这是四条路线里唯一可能让日本不成为地区反派的路线\n\n§B风险§!：不扩张意味着你不能快速拉选区——议会席位增长慢，长期受制于§R军部§!和§D贵族院§!\n\n§Y━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━§!\n\n§Y重要分歧事件索引§!\n\n§G§l§l必触发事件§!：\n· §G金光庸夫内阁成立§!（开局）——总理金光庸夫，48月后第一次议会选举倒计时\n· §G众议院预算法案§!（JAP_focus_3后）——国会必须通过贸易法案（200席）才能打越南\n\n§R§l§l风险事件§!：\n· §R五三会叛乱§!（走打击路线）——鸠山一郎带40席出走\n· §R军部干预§!（连续2年法案失败）——内阁倒台，可能触发§G二二七事变重演§!\n· §R日英外交危机§!（进军越南）——英国可能对日本宣战\n· §R美英中联合干涉§!（总体战路线+连续扩张）——三列强施压\n· §R荷兰殖民抵制§!（南洋开发没铺垫）——荷兰+英国海军联合\n\n§Y必用国会技巧§!：\n· 选§B连立§!：206+106=312席，直接破310！缺点是每月PP分给联合党\n· 选§G游说§!：花20PP拉5个无所属，总席211（还是不够234——连立是王道）\n\n§O最终忠告§!\n\n§Y宪政常道§!是最稳的——但§B政友会§!内部有§R五三会§!分裂风险，§D贵族院§!是定时炸弹。\n§Y帝国军改§!是最快的——但§R310席修宪门槛§!是硬伤。\n§Y越南危机§!是最赌的——走得好快速扩张，走不好全军覆没。\n§Y海洋战略§!是最磨人的——但也是唯一让日本以§W和平大国§!崛起的可能。\n\n记住：§O金光庸夫§!之所以能当上总理，是因为尾崎行雄认为他"§G最不坏的选择§!"。宪政刚从棺材里爬出来，别让它再死一次。"

tong_yong_lu_xian_zhi_nan: "§Y通用路线指南§!\n\n当前国家暂无特殊剧情，请自由探索国策树分支。\n\n§O小提示§!\n· 所有国家都有§Y陆军/经济/海军/政治§!四大国策分支\n· 国会系统（若适用）法案有席位阈值，开局席位不够时可通过§G连立政府§!或§G游说活动§!凑票\n· 每48月一次选举，可花§Y50政治点§!提前解散\n· 法案过不了会触发政府危机事件，请谨慎选择"
