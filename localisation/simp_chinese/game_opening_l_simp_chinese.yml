 mod_jie_shao_wen_ben: "§O开发人员包括前成员§!\n\n大汗、鸢尾花雕塑、QAQ、笨蛋少女Asahi、Alice、中间派、siquxhe、轩辕韵白、КОРКОВСКИЙ、赟、地灵殿、维齐尔、牢梦、sov的毁灭者的好师傅、加香竹席_official\n\n§O特别鸣谢§!\n\nsergey taboritsky\n\nQQ群：177432169\n\nDiscord: https://discord.com/invite/T6uerdtR6V \n\n该页面可以通过右上角点击£GFX_achievements_button 打开。"
 mod_te_se_ben: "mod特色\n\n§O军衔系统§!\n玩家可以通过带领军队来积累经验以便提升军职,目前有少将、中将、上将这三个军衔,军衔的提升是自动的,只要满足要求就可以晋升一级。\n\n§O粮食系统§!\n在显示界面你可以看到当前国家的存粮储备，这里的粮食主要包括农作物、海产品等一系列粮食产出，农场的数量以及人口数量会影响粮食的产出和消耗，在省份界面你可以选择强行征收当前的粮食。"
