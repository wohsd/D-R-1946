 Arab_oil_pipeline_desc:0 "阿拉伯横贯油管计划从凯苏马通往赛达港的原油管道，全长1718公里，管径为30英寸与31英寸，是中东地区最长的原油运输管道。该管道主要功能为缩短波斯湾原油输送至欧洲及美洲的距离，输油能力预计每年能达到2500万吨。"

