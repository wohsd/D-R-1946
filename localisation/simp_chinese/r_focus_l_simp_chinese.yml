l_simp_chinese:
 eco_newevent.1.t:0 "欧债危机爆发"
 eco_newevent.1.d:0 "短暂的繁荣期过后，美国经济出现明显颓势，表现为失业率大幅上升及工业指数持续走低。为此，美国与西欧等发达经济体不得不斥巨资稳定金融体系、提振市场需求。然而，庞大的重建支出与这些国家雄厚的总体经济实力形成了矛盾：不断累积的政府债务与日益恶化的财政状况，耗尽了金融流动性，最终导致危机从金融领域演变为全面爆发的债务危机。"
 eco_newevent.1.a:0 "欧洲该如何度过这个冬天"

 eco_countryevent.1.t:0 "债务危机席卷我国"
 eco_countryevent.1.d:0 "近日，财政部发布的紧急报告在国内各界引发了剧烈震动。报告显示，为支撑先前庞大的军事开支与工业补贴，国库已不堪重负。国际市场对我国偿还能力的信心正在急剧丧失。\n\n内阁警告称，这场危机已不再是纸面上的数字游戏。从边境的守军是否还能按时收到军饷，到主要城市的工厂是否会因资金链断裂而大规模停工，国家的战争能力与社会稳定正面临最直接的考验。有反对派议员在议会激烈地指责，称这是“一场早已注定的灾难”。"
 eco_countryevent.1.a:0 "欧洲该如何度过这个冬天"

 RUS_WARnewevent.1.t:0"伊凡雷帝行动"
 RUS_WARnewevent.1.d:0"由于德意志共和国近年来种种亲西方行为，俄罗斯帝国对德意志共和国正式发起“伊凡雷帝行动”，俄罗斯外长更是将此次行动比作“哥哥教育弟弟”，宣战当日凌晨4时，俄军兵分北、中、南三路同步进攻：北部集群以轰炸机群精准打击汉堡港口、海军基地等关键设施。"
 RUS_WARnewevent.1.a:0"真是熟悉的借口"


 EGY_newevent.1.t:0 "西奈战争爆发"
 EGY_newevent.1.d:0 "在上次的世界大战中，英埃联军成功击退了俄罗同盟的进攻，使得英埃获得了苏伊士运河的控制权。沙俄全力扶持以色列国，早已对埃及不准它的船只通过亚喀巴湾的蒂朗海峡和苏伊士运河不满，而今这颗一点即炸的火药桶正式被以色列点燃。"
 EGY_newevent.1.a:0 "漫天的蒲公英在半岛上空绽放"

 ISR_newevent.1.t:0 "以色列控制西奈半岛"
 ISR_newevent.1.d:0 "在以军伞兵的突击下，埃及军队被切断了漫长的补给线，绝大部分的埃及军队在突如其来的攻势下击溃，成批的埃及俘虏被塞入车内。随着最后一支埃及军队撤离半岛，以军彻底控制了整座西奈半岛。"
 ISR_newevent.1.a:0 "起开，我们没有时间俘虏你们"




 fra.1.t:0 "戴高乐政变"
 fra.1.d:0 "内阁的不稳定和第四共和国面临经济问题的束手无策导致法国政体面临严重的危机。来自各界的许多政治要人都希望能有一个强劲领袖来救国家于水火。以戴高乐为首的救国委员会成立。戴高乐向全国发出呼吁，如今暴动规模迅速扩大，并有演变成内战的可能。议会的553票中以329票赞成通过授权戴高乐组建新政府，并准许其进行宪法改革。"
 fra.1.a:0 "唯有威权才能服众"

 vin.1.t:0 "越南爆发起义"
 vin.1.d:0 "越南同盟会在宣光省新潮召开全国会议，决定集中力量，统一行动与指挥，及时发动起义。越南同盟会在新潮举行国民大会，提出夺取政权、在完全独立的基础上建立越南民国、武装人民和实行民主改革的十大政策，选出以阮海臣为主席的民族解放委员会和以武鸿卿为主席的起义委员会，从日军手里夺取全国政权。"
 vin.1.a:0 "革命正在席卷越南"

 vin_loss.1.t:0 "越南帝国战败"
 vin_loss.1.d:0 "随着最后一杆越南帝国旗帜的降下，保大皇帝和皇室被迫流亡日本。武鸿卿所代表的越南国民党在河内正式宣布了越南民国的成立。越南国民军的胜利代表了中华民国在东南亚力量投射的第一次全面胜利。"
 vin_loss.1.a:0 "三民主义绽放在越南上空"


 USA_newevent.1.t:0 "第一台电脑问世"
 USA_newevent.1.d:0 "美国宾夕法尼亚大学电工系由莫利奇和艾克特领导，为美国陆军军械部阿伯丁弹道研究实验室研制了一台用于炮弹弹道轨迹计算的“电子数值积分和计算机”。这台叫做“埃尼阿克”的计算机占地面积150平方米，总重量30吨，使用了18000只电子管，6000个开关，7000只电阻，10000只电容，50万条线，耗电量140千瓦，可进行5000次加法/秒运算。这个庞然大物于1946年2月15日在美国举行了揭幕典礼。这台计算机的问世，标志着电脑时代的开始。"
 USA_newevent.1.a:0 "很难想象40年后的人会用电脑做出多么伟大的事情"

 USA_Trump.1.t:0 "新生命"
 USA_Trump.1.d:0 "一名新生儿诞生在美国纽约皇后区的一所社区医院中，其父弗雷德·特朗普是纽约有名的地产开发商，早在20世纪20年代末，特朗普开始在皇后区投建独立住宅。他在皇后区木巷开立的特朗普商场通过广告“自己吃任你选！”而一炮打响，帮助开拓了超级商场的概念。尽管有传言声称弗雷德·特朗普经常参与3K党活动，但其本人极力否认。"
 USA_Trump.1.a:0 "特朗普?好名字"

 black_flower.1.t:0 "黑色大丽花"
 black_flower.1.d:0 "1947年1月15日，肖特被肢解的尸体在洛杉矶南诺顿大道3800街区空地被发现，尸体拦腰截断、脏器缺失、血液流干，面部被割裂至耳根形成“小丑式笑容”。洛杉矶警方投入750名调查员，排查超过150名男性嫌疑人，包括外科医生乔治·霍德尔等25名重点对象，但均因缺乏证据未能逮捕。"
 black_flower.1.a:0 "Zodiac"

 GER_nuke.1.t:0 "德国举行核爆试验"
 GER_nuke.1.d:0 "当地时间今日上午九点四十五分，德意志共和国在乍得殖民地北部阿伊尔高原荒漠，成功引爆人类首枚原子弹，试验代号“普罗米修斯”。爆炸产生的蘑菇云在三百公里外的津德尔市清晰可见，瞬间腾起的蓝白色闪光亮度远超正午阳光，数秒后冲击波携灼热气浪横扫戈壁，将方圆五公里内沙砾、灌木化为灰烬。\n\n德国国防部证实，此次核爆当量约1.5万吨炸药，中心形成直径超两百米熔蚀弹坑，地表温度峰值突破五千摄氏度。"
 GER_nuke.1.a:0 "战争之神要换代了"


 GER_focusevent.1.t:0 "日耳曼尼亚计划落成"
 GER_focusevent.1.d:0 "日耳曼尼亚计划东西中轴大道长达50公里，东边是伍斯特马克，穿越勃兰登堡大门，抵达西边的法兰克福林荫大道。南北中轴大道长达40公里，北边是莫阿比特南端是滕佩尔霍夫。当施佩尔于1938年1月将这个计划公之于世时，媒体反响激烈。美国《纽约时报》称之为也许是当今世界“最具有雄心壮志的规划”。\n\n而今，这项持续8年的伟大工程，在燃烧数以亿计马克为代价下，剪彩仪式在柏林人民大厅前由总设计师希特勒先生和他的副手施佩尔共同举行。"
 GER_focusevent.1.a:0 "向着新千年进发"



 GER_countryevent.1.t:0 "新年致辞"
 GER_countryevent.1.d:0 "全国议会大厦今日清晨钟声回荡，弗朗茨·冯·帕彭和德皇威廉三世共同出席了新年典礼。来自天主教中央党、自由民主党与社会民主党的联合内阁走马上任，这是统一战争胜利后首届跨党派政府，亦被外界视为君主立宪制度走向成熟的“制度性拐点”。新年演说中，73岁的帕彭以低沉而坚定的语调宣示：“统一的神圣全国又迎来了新的一年，我们的任务不再是扩毛，而是制度化、现代化与欧洲化。”言罢，议会大厅响起长达一分钟的掌声，亦夹杂着左翼议员对“社会公平”议程的期许。"
 GER_countryevent.1.a:0 "迎接美好的一年"


  GER_countryevent.2.t:0 "南德议员团首次出席"
  GER_countryevent.2.d:0 "柏林-维也纳快速专列驶入全国车站，南德地区（原奥地利）议员团首次以完全平等身份出席议会例会。《全国区域自治法案》正式生效，维也纳霍夫堡皇宫升起三色旗，与柏林宫遥相呼应。议员们提交“阿尔卑斯工业复兴备忘录”，内阁书面承诺将维也纳电气、施泰尔钢铁纳入全国工业协作区，区域整合迈出关键一步。"
  GER_countryevent.2.a:0 "阿尔卑斯的回声"

  GER_countryevent.3.t:0 "鲁尔警告性罢工"
  GER_countryevent.3.d:0 "鲁尔区矿工联合会宣布举行四十八小时“警告性罢工”，要求提高工资并参与煤炭定价。铁路货运量骤降三成，帕彭内阁连夜召集劳资双方在埃森市政厅谈判，最终签署《鲁尔协议》：政府设立“工人代表会议”参与利润分红，工会同意立即复工。媒体称之为“社会市场经济的第一块基石”。"
  GER_countryevent.3.a:0 "矿火暂熄"

  GER_countryevent.4.t:0 "欧亚制度峰会"
  GER_countryevent.4.d:0 "外交部长牛赖特率团赴克拉科夫出席第七届欧亚互助理事会，提出设立常设秘书处、科技协作基金与非约束性人权咨询委员会。经过九轮闭门磋商，德俄最终采纳“共同主席轮值制”，华沙将矗立崭新的欧亚联合秘书处。莫斯科特使评价：“德国不再是单纯的军事伙伴，而是制度设计者。”"
  GER_countryevent.4.a:0 "东方的新架构"

  GER_countryevent.5.t:0 "皇权边界法案通过"
  GER_countryevent.5.d:0 "全国议会经过九小时马拉松辩论，以七票微弱优势通过《皇权边界法案》。德皇宣战须获人民院三分之二多数，外交条约须在三十日内提交议会备案，并设立全国宪法法院裁定皇权行为是否违宪。威廉三世签字时感慨：“朕的权力被关进了笼子，但全国因此获得了笼子外的天空。”"
  GER_countryevent.5.a:0 "笼子中的皇冠"

  GER_countryevent.6.t:0 "社会市场经济宣言"
  GER_countryevent.6.d:0 "经济部长艾哈德在科隆工商联合会发表“社会市场经济宣言”，宣布逐步取消煤炭、钢铁价格上限，设立“全国社会保险基金”由雇主与雇员共缴。工商界掌声雷动，工会则警告“市场自由不可牺牲公平”。艾哈德对记者坦言：“改革如同走钢丝，左边效率，右边公平，我们要在钢丝上跳双人舞。”"
  GER_countryevent.6.a:0 "钢丝上的双人舞"

  GER_countryevent.7.t:0 "欧亚关税协定签署"
  GER_countryevent.7.d:0 "德俄与俄罗斯、捷克、匈牙利代表在明斯克宫签署《欧亚关税协定》，建立五国零关税区并统一对外关税。德国工业联合会主席宣称：“我们的机器将畅通无阻驶向东方，东方的粮食与木材将滋养鲁尔的烟囱。”法国《费加罗报》警告“横跨大陆的经济巨人正在苏醒”，柏林交易所钢铁股当日飙升至三年新高。"
  GER_countryevent.7.a:0 "零关税的东方"

  GER_countryevent.8.t:0 "五一对话台"
  GER_countryevent.8.d:0 "5月1日，柏林工人举行和平游行，要求缩短工时与扩大失业保险。政府在全国议会前设立“对话台”，帕彭首相亲自接见工人代表，承诺年内提交《失业保险扩展法案》。当日《法兰克福报》评论：“政府不再惧怕街头，而是走上街头；这不是让步，而是制度的自信。”"
  GER_countryevent.8.a:0 "街头的自信"

  GER_countryevent.9.t:0 "阿尔卑斯防区设立"
  GER_countryevent.9.d:0 "国防部发布《全国防卫新纲》，宣布设立“阿尔卑斯防区”，将南德地区纳入统一指挥体系，并在维也纳成立“南德军事学院”，专门培养多语种军官。总参谋长施莱歇尔强调：“我们的目标不是进攻，而是让任何潜在对手都不敢轻易下注。”维也纳市民在霍夫堡广场目送首批学员列队通过，掌声与低声议论交织。"
  GER_countryevent.9.a:0 "桥梁亦或堡垒"

  GER_countryevent.10.t:0 "区域事务协调法"
  GER_countryevent.10.d:0 "全国议会通过《全国区域事务协调法》，确立南德地区在税收、教育、文化事务上的“共管模式”：中央与地方各派三名委员组成常设委员会，所有决策须一致通过。维也纳大学法学院院长表示：“我们不再是全国的边缘，而是制度的合伙人。”"
  GER_countryevent.10.a:0 "共管的合伙人"

  GER_countryevent.11.t:0 "经济季报飘红"
  GER_countryevent.11.d:0 "今日公布的《全国经济季报》显示：工业产值连续两个季度增长，失业率较年初下降1.8个百分点，出口同比增长9.1%，其中对欧亚阵营国家出口占比首次突破50%。艾哈德在记者会上难掩喜色：“数字不会撒谎，市场正在奖励有勇气改革的人。”柏林交易所当日收盘创下统一以来新高。"
  GER_countryevent.11.a:0 "数字的奖赏"

  GER_countryevent.12.t:0 "劳资协商法通过"
  GER_countryevent.12.d:0 "内阁通过《劳资协商法》，要求凡雇员超过五十人的企业必须设立“工人代表会议”，享有知情权、咨询权与共决权。资方代表警告“这是向共决制迈出的一步”，改革派则回以掌声：“责任不再由资本独担，而是由劳动与资本共同承担。”法案被视为社会市场经济框架下劳资权力再平衡的关键一步。"
  GER_countryevent.12.a:0 "共决的第一步"

  GER_countryevent.13.t:0 "能源与工业协定"
  GER_countryevent.13.d:0 "德国与达契亚在布加勒斯特签署《能源与工业协定》，德方提供炼油设备与技术，保证十年内对德出口原油与天然气。这是欧亚互助框架下首个双边能源长期协议，被媒体称为“钢铁与石油的联姻”。协议签署后，柏林至康斯坦察的铁路货运计划已排至1950年春。"
  GER_countryevent.13.a:0 "钢铁与石油的联姻"

  GER_countryevent.14.t:0 "南德军事学院入学"
  GER_countryevent.14.d:0 "首批“南德军事学院”学员在维也纳霍夫堡军营宣誓入学，其中三分之一来自原奥地利地区。毕业典礼上，威廉三世亲临致辞：“你们不仅是军官，更是全国的桥梁，连接阿尔卑斯与波罗的海，连接传统与未来。”当学员列队通过广场，维也纳市民报以掌声，亦有人低声议论“桥梁亦或堡垒，皆在一念之间”。"
  GER_countryevent.14.a:0 "桥梁的誓言"

  GER_countryevent.15.t:0 "秋季对话"
  GER_countryevent.15.d:0 "内阁与工会代表在波茨坦举行“秋季对话”，就缩短工时与扩大带薪休假达成原则协议。政府承诺在1947年提交《劳动时间法》草案，逐步推行每周48小时工作制。工会主席在会后表示：“我们不是敌人，而是共同走钢丝的伙伴。”媒体将此次对话称为“共识政治的新样板”。"
  GER_countryevent.15.a:0 "共识的样板"

  GER_countryevent.16.t:0 "核试验取得进展"
  GER_countryevent.16.d:0 "全国物理技术研究所的秘密实验室传来突破性消息，铀浓缩技术的临界阈值测试取得关键进展，核裂变链式反应的可控性验证完成阶段性目标。帕彭内阁随即成立“全国原子能委员会”，由国防部长与经济部长联合牵头，严格限制信息披露范围，仅向议会核心成员通报“能源与工业应用潜力”，对外则以“高级物理研究项目”名义模糊回应。地下实验室开始接收来自捷克斯洛伐克的铀矿原料，相关铁路运输被纳入军事级安保体系，科学家团队获得全国专项科研津贴，家属安置由内政部统一协调。"
  GER_countryevent.16.a:0 "太好了"






  GER_countryevent.17.t:0"劳资共决"​
  GER_countryevent.17.d:0"全国议会经多党派磋商，确定员工超两百人的企业需设立工人事会，且工人监事占比不低于三分之一。鲁尔区的煤矿与钢铁厂率先毛贴公告，公示工人参流程，柏林《全国日报》以“劳资共决的第一步”为题刊发社论，称赞该制度是“战后社和解的基石”。同期，全国经济部在汉堡、不来梅港口试点进出口审批简化，货运单据的盖流程缩减近半，往来于波罗的海的商船卸货效率显著提升，汉堡港的吞吐量较上月增长，商人们开始试探性扩大与北欧国家的木材、鱼类贸易。"​
  GER_countryevent.17.a:0"可别再来几次大罢工了"​

  GER_countryevent.18.t:0"统一薪资标准"​
  GER_countryevent.18.d:0"低温炉管制正式松绑，居民家用取暖炉不再受限燃料类型，柏城郊的铁匠铺重新燃起传统燃煤炉，街头久违的煤烟气息与新年的喜庆交织。帕彭首相在帝议会发表演讲，提出年内统一南德工业协作区薪资标准的目标，引发巴伐利亚、奥地利地区业主与工会的热烈讨论。不少企业主主动联系当地工会，就薪资层级、加班补偿等问题展开沟通，维也纳的一家精密仪器厂甚至提前与工会达成临时薪资协议，成为协作区的示范案例"​
  GER_countryevent.18.a:0"工人理应为了祖国感到自豪"​

  GER_countryevent.19.t:0"48小时工作制"​
  GER_countryevent.19.d:0"48小时工作制在全国范围内正式推行。初期，部分中小型企业排班调整出现短暂生产停滞，帕彭内阁迅速派出经济协调员分赴各州工业区指导。鲁尔区的型钢铁厂将三班倒改为四班制，工人们首次拥有完整周末，短途铁路客运量激增，多特蒙德埃森的短途列车加开了三成班次，车厢里挤满了携家出游的工人家庭，小镇的咖啡馆、公园迎来了久违的热闹。"​
  GER_countryevent.19.a:0"让我们看看左派还有什么话好说"​

  GER_countryevent.20.t:0"深化德俄协作"​
  GER_countryevent.20.d:0"威廉三世亲自出席公开审议会议，表态 “将完全尊重议多数意志”，这一姿态彻底打消了政治层面的疑虑。与此同时，欧亚互助组织产业协作会议在柏林召开，德国机械制造企业与俄国能源企业署三份技术输出协议，柏林街头随处可见佩戴公文包的俄国商务代表，咖啡馆里德语与俄语交谈声此起彼伏，德俄联合研发的新型输油管道技术成为会议焦点。"​
  GER_countryevent.20.a:0"至少现在俄国依旧是我们最重要的伙伴"​

  GER_countryevent.21.t:0"慕尼黑劳资试点"​
  GER_countryevent.21.d:0"劳资共决试点在慕尼黑一家汽车制造厂落地，工人监事首次参企业季度生产计划会议。会上，工人代表提出的 “增加车间通风设备”“优化劳动保护用具”等提议全票通过，消息通过报纸传遍全国后，各地工会纷纷组织工人学习劳资共决规则。帕首相亲赴慕尼黑视察，与工人监事握手的照片登上各大报刊头版，鲁尔区的矿工们在井下休时，也热议着 “自己能为矿上提建议”的新鲜事。同期，全国农业部调整农产品收购制度，少政府强制收购比例，允许农民自主售卖部分农产品，巴伐利亚的乡村集市重新活跃，新鲜菜、乳制品的直接交易让农民收入小幅增长。"​
  GER_countryevent.21.a:0"祖国，国家，人民"​

  GER_countryevent.22.t:0"灰卷制度终结"​
  GER_countryevent.22.d:0"延续多年的 “灰卷” 制度正式退出食品供应领域，全国商务部布新食品流通条例，允许私营食品商店自主定价、自由进货。柏林弗里德里希大街的第一家营面包店开业，店门口排起长队，市民们无需再凭票定量购买，而是可以自由挑选全麦面包牛角包等各式糕点，面包的香气飘满整条街道。"​
  GER_countryevent.22.a:0"再无大萧条"​

  GER_countryevent.23.t:0"德国制造"​
  GER_countryevent.23.d:0"全国议会正式通过《工人监事制度实施细则》，明确工人监事选举流程、任期及权责范围，标志着劳资共决制度在全国范围内制度化。同一时间，欧亚互组织技术交流团造访鲁尔区钢铁厂，俄国工程师深入学习低温轧制技术，而德国工程师则启前往俄国西伯利亚油田，提供开采设备维护的技术支持。双方在车间、油田现场的手把手学，让德俄产业协作从纸面协议落到实际操作层面，东欧市场对德国机械的需求持续升温。"​
  GER_countryevent.23.a:0"这就是德国制造"​

  GER_countryevent.24.t:0"工业博览会试点"​
  GER_countryevent.24.d:0"社会市场经济相关税收政策启动试点，汉堡、科隆的中小企业推行劳资共决，可享受5%的企业所得税减免。这一政策极大调动了企业积极性，科隆的一纺织厂仅用两周就完成工人监事选举，成为首批享受税收优惠的企业。月底，柏林举办了工业博览会，展厅内不仅陈列着低温轧制设备、精密仪器等工业成果，还专门设置了 “社会市场经济展区”，通过图表、模型向民众科普劳资共决、税收改革的核心内容。"​
  GER_countryevent.24.a:0""​

  GER_countryevent.25.t:0"工人公寓"​
  GER_countryevent.25.d:0"恰逢《波茨坦共识》签署一周年，帕彭首相在波茨坦发表演讲公布转型成果：全国已有超3000家企业设立工人监事会，48小时工作制让工人平均休息间增加 20%，社会失业率较战后初期下降8个百分点。演讲现场掌声不断，媒体评价 “德已走出战时阴霾，迈向稳定发展”。民生领域同样传来利好，全国住房部启动工人公寓建设划，首批公寓配备了战时推广的窗框通风器，兼顾保暖与通风，柏林、鲁尔区的工人纷纷提居住申请，期待能搬进宽敞明亮的新家。"​
  GER_countryevent.25.a:0"似曾相识的公寓"​

  GER_countryevent.26.t:0"德俄双边贸易协定"​
  GER_countryevent.26.d:0"德国与俄罗斯签署双边贸易协定，德国机械产品免税进入俄罗斯场，俄罗斯农产品则以优惠税率输德。波茨坦港口迎来首批装载俄罗斯小麦的货轮，而德国的床、农业机械也陆续运往俄罗斯，这一协定进一步巩固了德国对东欧的技术与资本输出框架。期，全国工会联合会召开全国代表大会，鲁尔区工人代表提出 “在大型企业设立工人代表办室” 的提案，引发广泛讨论，工会与企业的沟通渠道正在持续拓宽。"​
  GER_countryevent.26.a:0"工业齿轮滚滚运作"​

  GER_countryevent.27.t:0"新技术推广"​
  GER_countryevent.27.d:0"低温轧制技术在南德工业协作区全面推广，巴伐利亚一家铝制厂应用该技术后，生产成本降低15%，产品精度显著提升，订单量较上月增长20%。技术利让南德工业竞争力进一步增强，奥地利的汽车零部件厂也纷纷引进该技术，协作区内部的业协同效应愈发明显。全国议会同期启动新社会保障法案的讨论，计划将养老保险覆盖范围大至临时工、小商贩等群体，帕彭首相在议会强调 “社会保障是社会市场经济的底线，不能任何一个人掉队”。"​
  GER_countryevent.27.a:0"更快，更好"







  GER_countryevent.28.t:0"核计划隐秘提速"
  GER_countryevent.28.d:0"全国原子能委员会召开闭门会议，按威廉三世御批定下三月内完成小型反应堆测试的目标，同步拨付未标注用途的专项预算至柏林核研机构。联邦议会虽有人质疑资金去向，但按 1871 年宪法中皇帝主导科研预算的规定，首相办公室仅以 “能源危机预案” 轻描淡写回应。"
  GER_countryevent.28.a:0"核计划推进获宪法支撑。"

  GER_countryevent.29.t:0"边境外交暗战"
  GER_countryevent.29.d:0"连接原捷克领土与全国核心区的波西米亚边境检查骤然升级，沙俄 “商务考察团” 频繁现身。双方在波茨坦秘谈，沙俄以放宽乌克兰市场机械配额为筹码，换取100名德国核领域科学家赴俄指导。同期，维也纳精密仪器厂接获全国陆军部耐高压铀燃料容器订单，印证此前技术交流暗藏深意。"
  GER_countryevent.29.a:0"外交与军事合作关联紧密。"

  GER_countryevent.30.t:0"监事制度显效"
  GER_countryevent.30.d:0"鲁尔区钢铁厂工人监事首次行使否决权，驳回管理层延长高炉工时的提案。目前全国超5000家企业设监事会，覆盖奥、捷新增工业区，工会安全建议三成落地。汉堡港因审批简化，吞吐量较战前翻倍，北欧货轮络绎不绝。"
  GER_countryevent.30.a:0"监事制度提升生产效率。"

  GER_countryevent.31.t:0"德俄管线开工"
  GER_countryevent.31.d:0"德俄联合在沙俄巴库油田启动输油管道建设，项目表面为 “皇家能源协作”，实则为全国机械打开沙俄腹地市场。俄国公使隐晦索要核反应堆冷却系统图纸，帕彭首相在议会强调 “技术输出促奥捷就业”，却对技术外泄问题避而不答。民调显示 62% 民众支持对俄合作，鲁尔工厂已因俄订单扩招千人。"
  GER_countryevent.31.a:0"对俄合作获民众支持。"

  GER_countryevent.32.t:0"社保法案落地"
  GER_countryevent.32.d:0"全国议会高票通过新社保法案，将养老保险覆盖范围从核心产业工人扩展至临时工、小商贩，且同步适用于奥、捷并入地区。法案暗藏特殊条款：核科研人员自动享受最高档社保，为维也纳、布拉格来的技术骨干解决后顾之忧，民众参保热情高涨，波西米亚乡村单日参保超二十人。"
  GER_countryevent.32.a:0"社保扩容激发参保热情。"

  GER_countryevent.33.t:0"北欧贸易结盟"
  GER_countryevent.33.d:0"德国与瑞典、挪威签署《波罗的海贸易协定》，全国机床以 “技术援助” 名义免税入北欧，作为交换，挪威承诺优先供应核计划急需的重水。汉堡港铁矿吞吐量激增，刚到港的瑞典铁矿石即刻转运鲁尔及奥地利钢铁厂，原料成本较此前下降三成，缓解了工业扩毛的原料压力。"
  GER_countryevent.33.a:0"贸易结盟保障原料供应。"

  GER_countryevent.34.t:0"反应堆临界测试"
  GER_countryevent.34.d:0"鲁尔区地下实验室传来突破，由奥、德科学家组成的团队成功完成 20 分钟反应堆临界测试，中子计数器稳定达到临界值。虽功率仅够点亮十盏灯，却坚定了全国信心，帕彭首相当即获御批续拨双倍科研资金。消息未对外公布。"
  GER_countryevent.34.a:0"技术突破未公开披露。"

  GER_countryevent.35.t:0"施压与拉拢"
  GER_countryevent.35.d:0"美国驻德大使突然造访首相官邸，抛出 “工业援助计划”，条件是公开核研究进展，月底柏林工业博览会上，美国高调展示核发电模型争夺话语权。"
  GER_countryevent.35.a:0"拒绝美方条件。"
  GER_countryevent.35.b:0"这未尝不可。"

  GER_countryevent.36.t:0"工业协作扩容"
  GER_countryevent.36.d:0"原捷克波西米亚工业区正式并入南德 - 奥地利协作区，布拉格汽车零部件厂引入鲁尔低温轧制技术后，活塞精度提升25%，订单排至次年春。协作区同步敲定统一技术与薪资标准，慕尼黑、维也纳、布拉格三地工人月薪差距缩至10%，多特蒙德矿工戏称 “跨区干活不用算汇率了”。"
  GER_countryevent.36.a:0"协作区统一标准促发展。"

  GER_countryevent.37.t:0"贸易波折"
  GER_countryevent.37.d:0"载有德国机床的货轮在但泽港滞留三日，沙俄突然要求经俄属波兰质检，实则企图拆解获取技术。因波兰占全国机械出口15%份额，帕彭内阁被迫妥协，同意每批货物附赠维修手册。贸易摩擦意外让民众受益，波兰小麦进口价降两成，柏林、维也纳面包店全麦面包应声便宜5芬尼。"
  GER_countryevent.37.a:0"贸易摩擦。"

  GER_countryevent.38.t:0"核人员换防"
  GER_countryevent.38.d:0"全国原子能委员会实施秘密轮岗，实验室核心团队分批调往柏林郊区新基地。该基地反应堆规模扩至三倍，围墙高十米，对外伪装成“皇家农业研究所”，技术员家属仅收到“机密任务”通知。"
  GER_countryevent.38.a:0"保密措施防止技术外泄。"

  GER_countryevent.40.t:0"住房优化法案颁布"
  GER_countryevent.40.d:0"本国政府颁布《1949年住房优化法案》，计划三年内新建150万套宜居公寓，缓解城镇化进程中住房紧毛问题。法案明确每平米月租上限0.42马克，为承建企业提供 25% 建设补贴，优先保障鲁尔工业区工人与城市新居民居住需求。柏林郊区首批8个住宅项目已同步开工，采用标准化预制构件施工，预计半年内可交付4万套住房，《柏林日报》将其称为 “宜居家园计划”。"
  GER_countryevent.40.a:0"本国政府以法案推动住房建设，改善民众居住条件。"

  GER_countryevent.41.t:0"联邦边境警备队扩容"
  GER_countryevent.41.d:0"本国政府对1928年成立的联邦边境警备队实施扩容，兵力从8000人增至1.5万人，新增人员以国防军退役士兵为主，重点强化边境巡逻、出入境管控与跨境治安协作职能。前国防军少将库尔特·哈泽主持扩容工作，首批扩容队员已在慕尼黑完成8周专业训练，政府强调此举是维护国家主权与边境稳定的必要举措。"
  GER_countryevent.41.a:0"本国政府扩容警备队，提升边境安防能力。"

  GER_countryevent.42.t:0"社会福利体系升级"
  GER_countryevent.42.d:0"本国议会经政府提议，通过《社会保障升级法案》，将养老、医疗、失业救济纳入统一管理平台。法案规定工人缴纳工资的 7%、雇主配套缴纳 11% 作为社保基金，失业者可领取原工资 55% 的救济金，同时新增育儿补贴政策。目前 10 个城市已率先设立社保服务中心，首日接待民众超1.8万人次。"
  GER_countryevent.42.a:0"本国政府升级福利体系，覆盖更多民生需求。"

  GER_countryevent.43.t:0"欧洲煤钢合作谈判"
  GER_countryevent.43.d:0"本国政府派遣代表团赴巴黎参加欧洲煤钢联营筹备谈判，提出 “鲁尔煤矿产能协作” 方案，以开放部分矿区生产数据为条件，换取法国洛林铁矿的优先供应权。谈判曾因一战后资源分配争议陷入僵局，经比利时斡旋最终达成共识：成立煤钢共同体最高管理局，相关协议已于月底正式签署。"
  GER_countryevent.43.a:0"本国政府推动煤钢合作，为国家争取关键席位。"

  GER_countryevent.44.t:0"原子能和平利用试验"
  GER_countryevent.44.d:0"本国政府主导的民用原子能反应堆测试在东普鲁士能源试验场完成，成功实现可控核裂变，输出功率达4.5兆瓦，主要用于科研与区域供电试点。测试数据显示能量转换效率82%，辐射水平完全符合安全标准，政府对外声明 “推进原子能和平利用，助力清洁能源转型”，美、法均派员观摩，鲁尔工业区已同步启动核电配套设备生产，新增就业 1 万人。"
  GER_countryevent.44.a:0"聚焦民用能源发展。"

  GER_countryevent.45.t:0"农业现代化计划启动"
  GER_countryevent.45.d:0"本国政府推出 “农业现代化计划”，投入4.2亿马克用于农业技术升级与农机普及。计划包括向农户发放低息贷款购置农机、每亩耕地补贴18马克用于土壤改良，同时在萨克森、巴伐利亚等地区建立15个农业技术推广站。政府还与丹麦签署粮食贸易协定，以精密机床换取8万吨小麦，月底统计显示全国小麦播种面积较去年增长12%，预计秋收产量提升 18%。"
  GER_countryevent.45.a:0"兼顾生产与贸易需求。"

  GER_countryevent.46.t:0"国防军装备更新计划"
  GER_countryevent.46.d:0"本国政府启动国防军新一轮装备更新计划，优先为陆军换装国产 “豹-I” 原型坦克，首批40辆坦克已在克虏伯工厂下线交付；空军接收10架亨克尔 He-178 喷气式战斗机，部署于柏林泰格尔机场；海军对2艘驱逐舰进行现代化改造，加装新型雷达与反潜设备。此次装备更新费用占当年国防预算的32%，政府说明此举是为维护国防军战备水平。"
  GER_countryevent.46.a:0"保障战备能力。"

  GER_countryevent.47.t:0"教育改革法案通过"
  GER_countryevent.47.d:0"本国议会经政府推动，表决通过《教育均等改革法案》，将1935 年确立的八年义务教育升级为九年制，重点消除教育资源分配的区域差异。法案规定农村地区每县至少建立1所完全中学，政府为贫困家庭学生提供免费教材与午餐补贴，同时设立 “人才培育计划”，首批资助 280 名学生进入柏林大学、慕尼黑大学深造。教育部数据显示，全国中学入学率较去年提升19%，女性学生占比达43%。"
  GER_countryevent.47.a:0"推动资源均等与人才培育。"

  GER_countryevent.48.t:0"劳资共决制度完善"
  GER_countryevent.48.d:0"本国政府颁布《企业劳资关系完善法案》，在1932年劳资协商制度基础上，首次以法律形式明确工人在企业管理中的共决权。法案规定员工人数超过100人的企业，监事会中工人代表比例不低于 30%；鲁尔区煤矿、钢铁等重工业企业，工人代表占比提升至 38%。目前柏林西门子公司、慕尼黑宝马工厂已率先落实新规，成立劳资联席会，工人代表参与工资调整、安全生产等决策，当月工人满意度达75%。"
  GER_countryevent.48.a:0"保障工人权益与企业民主。"

  GER_countryevent.49.t:0"国防军战备演练启动"
  GER_countryevent.49.d:0"本国政府组织国防军在勃兰登堡州启动年度战备演练，参演兵力1.2万人，涵盖陆军装甲旅、空军战斗机中队与海军近海巡逻编队，重点演练协同防御、应急机动与后勤保障科目。国防军总参谋长路德维希·贝克现场指挥，政府强调 “国防军自1925年建立以来，始终是国家的和平屏障”。"
  GER_countryevent.49.a:0"提升协同能力与国防储备。"


 

  DRV_countryevent.1.t:0"红河两岸的赤焰"
  DRV_countryevent.1.d:0"越北的寒夜里，红河三角洲的芭茅丛在北风中簌簌响个不停。游击队的指挥员阮文越蹲在临时掩体后头，手指在已经泛黄的地图上慢慢划过“永福—河内”那一线。队员黎德南猫着腰凑过来，压低声音报告：“鬼子第38警备队跟越南帝国军第2团搭上了，把永福边上三个县全给封死了，正一个村一个村地抢粮、抓人。”\n\n阮文越拧紧眉头，目光扫过地图上那些“水利枢纽”“稻产区”的标记。这时的越南，日本人嘴上说是“共同维持治安”，实际上就是靠着控制粮食和矿产，死攥着印度支那不放。越南帝国军那帮人，更是彻底当了日军的爪牙，靠人家发的枪来镇压自己人。\n\n“不能硬来。”阮文越丢开手里那根木棍，语气很定，“咱们眼下不是要吃掉这股敌人，是要掐断他们的命脉。”他手指戳向地图上一个渡口的位置，“鬼子抢来的粮食都得走红河运到河内中转，越南帝国军就负责沿途押送——这是他们的血管。我们集中人，盯着渡口打，把粮道截断。这样既能帮乡亲们喘口气，也能让鬼子跟伪军的补给乱套。”\n\n游击队人少枪也差，要是正面跟敌人干，简直就是拿鸡蛋碰石头。阮文越心里清楚，抗敌不光是打仗，更得争人心、抢资源。他马上把队伍分开：一路让黎德南带着，摸进封锁区去联络老乡，宣传抗敌，组织大家把粮食藏好、把年轻人转移；另一路自己亲自带队，就埋伏在渡口附近，等着机会动手。"
  DRV_countryevent.1.a:0"记住，一切行动听指挥"


  DRV_countryevent.2.t:0"红河两岸的赤焰"
  DRV_countryevent.2.d:0"渡口袭扰战打响。游击队利用夜色和红河沿岸的芦苇荡作掩护，精准打击了越南帝国军队的护送船队。混乱中，日军的增援部队被游击队预设的陷阱牵制，最终游击队不仅烧毁了三艘运粮船，还缴获了一批步枪和弹药。更重要的是，此次行动让周边村民看到了抗敌的希望，不少青壮年主动加入游击队，原本分散的抗敌力量逐渐凝聚。"
  DRV_countryevent.2.a:0"给殖民者的沉痛一击"


  DRV_countryevent.3.t:0"中国补给已到"
  DRV_countryevent.3.d:0"越北山区晨雾未散，黎德南便狂喜地冲到阮文越面前：“队长！中国补给到了！”\n\n阮文越赶到隐蔽营地，只见骡马旁的木箱里，崭新的步枪、成箱子弹、药品与压缩饼干整齐码放，还有几挺重机枪和农具布料。\n\n此前游击队被封锁得弹药告急、药品耗尽，农具短缺也拖累生产，这批补给无疑是雪中送炭。\n\n阮文越当即下令分发物资，叮嘱优先补给战斗部队、救治伤员，将农具布料送予村民互助组，语气坚定：“有了这些，我们既能顶住扫荡，更能扩大根据地！”\n\n消息传开，士气大振。村民主动帮忙搬运，青壮年踊跃参军。这份支援让游击队抗敌底气更足，独立的曙光正穿透烽火照进越北。\n\n消息很快传遍整个游击队和周边村落。原本因物资匮乏而有些低落的士气瞬间高涨，村民们主动赶来帮忙搬运物资，不少青壮年再次向游击队递交了参军申请。阮文越望着忙碌的人群，知道这不仅是一批物资的抵达，更是一份坚实的后盾——有了中国的支援，他们对抗日军和傀儡政权的底气更足了，民族独立的曙光，正随着这批补给的到来，照进越北的烽火之中。"
  DRV_countryevent.3.a:0"勿忘同志恩情"



  DRV_focusevent.25.t:0"调查贪污腐败"
  DRV_focusevent.25.d:0"革命胜利了，虽然留下了一地的烂摊子，但好在前帝国的国库为我们所有，我们理应将这笔巨额财富用来造福越南群众，但有消息称国民党高层涉嫌贪污腐败，将一些来历不明的财富转移至自己帐下。"
  DRV_focusevent.25.a:0"彻查到底"
  DRV_focusevent.25.b:0"睁一只眼闭一只眼"

  DRV_focusevent.26.t:0"武鸿卿贪污案"
  DRV_focusevent.26.d:0"一桩震惊全国的贪污案打破了表面的平静，而案件的核心人物，正是越南国民党元老、享有“抗日义士”之名的武鸿卿。\n\n彼时，武鸿卿凭借与中国国民政府的深厚渊源，以及在越南国民党内的崇高威望，手握中国援助的巨额重建物资调配权，涵盖粮食、药品、建材等关键物资。谁也未曾料到，这位曾为越南独立奔走半生的革命家，会在权力与利益的诱惑下迷失方向。\n\n目前越南国民党已经宣布开除武鸿卿党内一切职务，尽管开除了武鸿卿，但民众的怒火愈演愈烈，阮海臣也深陷腐败风波"
  DRV_focusevent.26.a:0"看来国民党的位置不保了"

  DRV_focusevent.27.t:0"越南国民党左派上台"
  DRV_focusevent.27.d:0"立国之后的第一次选举如约而至，碍于武鸿卿贪污案的波及，右派政府颜面扫地，国民党左派的支持率与日俱增。国民党右派的竞选海报刚毛贴上墙，便被愤怒的民众涂满“贪腐”“无耻”的涂鸦，其候选人出席的集会更是屡屡被抗议的口号打断，曾经因抗日功绩积攒的声望，在铁证如山的贪腐事实面前，荡然无存。C最终的计票结果不出所料，国民党左派以压倒性优势赢得选举，在国会中占据了过半席位，而曾经煊赫一时的越南国民党右派，正在逐渐沦为政坛边缘势力。"
  DRV_focusevent.27.a:0"为越南服务"







  CAM_DRV_event.1.t:0"柬埔寨概况"
  CAM_DRV_event.1.d:0"柬埔寨实行傀儡君主立宪制，诺罗敦·西哈努克国王徒有虚名，实际权力尽归日本国驻柬高级专员，殖民当局疯狂掠夺橡胶、大米等战略资源，60%民用工厂产出被强行上缴，仅靠少量殖民宪兵维持秩序，无任何独立军事力量，西哈努克试图在日本夹缝中谋求有限自治，而分散的民族主义力量与左翼人士已开始秘密联络越盟，在东北部边境酝酿抗法火种。"
  CAM_DRV_event.1.a:0"计划柬埔寨起义"
  CAM_DRV_event.1.b:0"武力介入"
 

  LAO_DRV_event.1.t:0"琅勃拉邦概况"
  LAO_DRV_event.1.d:0"琅勃拉邦王国在封建君主制下的西萨旺·冯国王完全受日本操控，全国工业设施近乎为零，正规军不足一个团，仅能依靠殖民辅助部队支撑统治，南北省份行政割裂、沟通阻滞，殖民当局加紧开采锡矿与森林资源供给。多山地丛林的地形虽为防御提供天然优势，苏发努冯亲王等爱国人士已着手联络边境部族，悄然筹备反殖民武装。"
  LAO_DRV_event.1.a:0"扶持红色亲王"
  LAO_DRV_event.1.b:0"武力介入"


  SIA_DRV_event.1.t:0"暹罗概况"
  SIA_DRV_event.1.d:0"暹罗王国在军政府的铁腕统治下，凭借军政府独裁的集权优势，与日本建立了军事与经济联系，在高压的政治环境下，民主和社会主义政党都消失殆尽。但在其军队内部则兴起了进步思潮，通过暹罗的线人联系，我们得知帕约姆·朱拉农特中校正在酝酿一场推翻政府的政变。"
  SIA_DRV_event.1.a:0"掀起军事政变"
  SIA_DRV_event.1.b:0"武力介入"

   CHI_nuke.1.t:0 "中国试爆原子弹"
   CHI_nuke.1.d:0 "当地时间今日下午三点二十五分，中国在新疆罗布泊无人区成功试爆原子弹，试验代号“逸仙”。远处的观测掩体里，沉寂瞬间被爆发的欢呼、呐喊与泪水冲破。科研人员、官兵相拥而泣，振臂高呼，多年的隐姓埋名、艰苦攻关，在这一刻化作中国最坚实的底气。东方巨响，震惊世界。中国从此打破核垄断，迈入核大国行列。"
   CHI_nuke.1.a:0 "马兰花开，重复，马兰花开"


  CHI_death.1.t:0"李烈钧病逝"
  CHI_death.1.d:0"李烈钧因患高血压，心肌梗塞等疾病，在重庆逝世，终年64岁。在病危中，李烈钧立下遗嘱：“兹者强敌虽摧，危机犹伏，全国同胞，务祈上下一心，精诚团结，咨诹善道，察纳雅言，紧握千载一时机会，迅速完成现代国家之建设，共维世界永久之和平。”\n\n李烈钧病故于重庆后，他的灵柩被运回家乡江西省九江市武宁县，葬于箬溪镇“读书台”。"
  CHI_death.1.a:0"精诚团结"


  CHI_death.2.t:0"三一七空难"
  CHI_death.2.d:0"1946年3月17日11时45分，引擎轰鸣刺破雨幕。戴笠乘坐的飞机从青岛沧口机场起飞，舷窗上的水珠将地平线扭曲成模糊色块。\n\n下午1时左右，南京江宁岱山传来爆炸巨响。机身撞上山脊的瞬间，油箱破裂，火光裹挟雨水喷溅，山坡碎石被烤裂。机上16人中仅一人幸存，戴笠的焦黑遗体后来通过金牙才得以辨认。\n\n据现场勘察，机头与机身烧成焦炭，机尾却完好无损，甚至清晰保留“222”编号。而戴笠专机残骸的断裂形态，恰似爆炸装置的“杰作”，机尾与机身分离，未受火焰波及。"
  CHI_death.2.a:0"此次空难另有隐情?"

  CHI_death.3.t:0"四八空难"
  CHI_death.3.d:0"王若飞、秦邦宪与叶挺、邓发等人，从重庆乘美制C-47运输机返南京汇报工作。飞机经西安加油后飞往南京途中遇极端天气，于下午2时左右偏离航线至黑茶山地域，与地面失去联系。晋绥公安总局现场勘查确认飞机因能见度低撞山坠毁，残骸发现于海拔2000米山坡，机上人员无人生还。"
  CHI_death.3.a:0"第二起空难，事出蹊跷"


  CHI_kangsheng.1.t:0"康生就任特科局长"
  CHI_kangsheng.1.d:0"原国民党中央特科局长戴笠在空难中遇难，20日康生紧急代理特科局长，主要负责调查此次空难。尽管党内部分人员议论这位戴笠曾经的死对头，但在康生上任后，这些流言大多烟消云散了。"
  CHI_kangsheng.1.a:0"务必水落石出"


  CHI_kangsheng.2.t:0"空难调查"
  CHI_kangsheng.2.d:0"新官上任三把火，康生就近期两起空难特案成立了专门办案组，康生在交付南京的档案中将矛头指向了党内的一些极端右翼倾向的官员。各种证据有理由怀疑是党内的破坏分子人为地制造了四八空难。目的是为了给三一七空难遇难的右派头子戴笠报仇，彻底分化党内的关系。\n\n一时间，各地政府官员人人自危，没人敢乘坐飞机出行，生怕成为下一个党争的受害者。"
  CHI_kangsheng.2.a:0"调查必须过枉"




  CHI_Mao.1.t:0"梧桐蔽日"
  CHI_Mao.1.d:0"梧桐蔽日，国民政府行政院的小会议室内，气氛却冷如冰窖。“润之兄，你的《和平时期土地改革纲要》...立意甚好，但操之过急。”财政部长宋子文指尖轻叩桌案，语气温和却不容置疑，“如今百业待兴，稳定为先。”毛泽东看着自己耗费两年心血起草的方案，封面上“保障自耕农，限制土地兼并，推广农业合作”的字样在昏黄灯光下格外刺目。“宋部长，民国十六年和平协定签署至今已十九年。城市工厂林立，农村却十室九空。”毛泽东的声音不高，却字字清晰，“江南地租仍高达收成的六成，华北佃户年收入不足城市工人的三成。这稳定，建立在千万农民的困苦之上。”\n\n会议桌旁，几位部长交换了眼神。教育部长李石曾叹了口气：“润之，道理都懂。可你调查里提到的大地主，很多是...自己人。北伐和平收编时承诺过，既得利益不动。”毛泽东心中一沉。北伐军兵不血刃进入北平，各方势力达成《共和共识》，避免了内战。代价是旧军阀、豪绅的利益被最大限度保留。他这个农民出身的农业部长，在世家林立的政府中，始终是个异类。"
  CHI_Mao.1.a:0"吾何以异于旧朝？"


  CHI_Mao.2.t:0"农业部长请辞"
  CHI_Mao.2.d:0"辞职手续办得很快。走出行政院大楼时，毛泽东只提了一只藤编箱子，里面装着他的调查报告和几本农学著作。\n\n火车南行，窗外风景渐变。江南水乡的稻田整整齐齐，却少见劳作的农民——土地大多集中在少数人手中，佃农们正按传统节气，等待插秧时节被雇佣。回到湖南湘潭那天，恰逢谷雨。二弟毛泽民在村口接他，一身粗布短褂，腿上还沾着泥。\n\n“哥，真不干了？”\n\n“不干了。回来种地实在。”毛泽东脱下外套，搭在手臂上。\n\n村庄比他记忆中小了许多。青壮年大多进城做工，留下的多是老弱妇孺。自家那五亩薄田由弟弟代耕，收成勉强糊口。第二天黎明，毛泽东换上旧衣裳，赤脚下田。春寒料峭，泥土的凉意从脚底直窜头顶，却让他感到久违的清醒。\n\n“大先生回来种地？”邻田的老汉马福贵拄着锄头，满脸不信，“您可是京城里的大官...”\n\n“马叔，叫我润之就好。”毛泽东抓起一把土，细细捻开，“这地，缺肥。”\n\n头三个月，他几乎不与人深谈，只是埋头侍弄田地。将从南京带来的土壤改良资料整理成通俗口诀，在自家地里做试验。引进的紫云英绿肥让板结的土壤逐渐疏松，合理轮作减少了病虫害。\n\n村里人起初远远观望，渐渐有人来请教。毛泽东来者不拒，在村头大槐树下办起“田头学堂”，讲土壤改良、良种选育、合理密植。"
  CHI_Mao.2.a:0"陈济棠能担此重任"
  CHI_Mao.2.b:0"左舜生能担此重任"


 









  ####JAP
  JAP_countryevent.1.t:0 "共荣圈峰会召开"
  JAP_countryevent.1.d:0 "尽管东亚局势风云变幻，然大日本帝国秉持东亚共荣之理念，始终致力于构建以日本为核心的东亚新秩序。值此之际，第4届共荣圈峰会于东京隆重召开，来自两大直辖总督府、菲律宾、安南、泰国等国的代表不远万里齐聚东京，向帝国汇报各自国家之近况。自昭和五年（1930年）重设拓殖务省及下属兴亚院以来，共荣圈峰会每四年举办一届，至今已是第四届。此届峰会之召开，不仅彰显了大日本帝国在东亚之领导地位，更象征着共荣圈各国对帝国之忠诚与信赖。"
  JAP_countryevent.1.a:0 "期待诸代表能带来振奋人心之消息"

  JAP_countryevent.2.t:0 "总督府现状"
  JAP_countryevent.2.d:0 "最先发来的是两大总督府的消息，台湾总督府自清日战争后根据《马关条约》得到的。1898年清日战争之后，帝国已经统治了朝鲜总督府近半个世纪的时间，而朝鲜则是在“东亚战争”前夕在外相牧野伸显运作下与俄国达成《第二次日俄密约》后吞并的。两大总督府的消息亦如同过去一样，无聊，平淡，但一切正常。两大总督府除了如同前几次峰会一样抱怨总督府境内的反日势力外，还带来了点好消息：台湾总督府的甘蔗、凤梨等热带作物产量与往年增加了很多，而朝鲜总督府在1937年发现的新矿产到今年产出量又提高了很多。"
  JAP_countryevent.2.a:0 "一切正常"


  JAP_countryevent.3.t:0 "越南现状"
  JAP_countryevent.3.d:0 "随后到来的是越南代表的消息。越南作为南洋战争前夕在日军武力威逼利诱下第一个被迫加入共荣圈的国家，其发来的消息始终是共荣圈内最糟糕的。根据越方代表的消息，中国国民党资助的“越南民族解放阵线”在近期的游击攻势已经愈演愈烈，帝国境内北部和南部的山区已经完全沦为越民的控制区，帝国没有任何能力进驻管理。在报告的末尾，越方代表竭力呼吁帝国尽可能多的援助越南，防御越盟势力的进攻。"
  JAP_countryevent.3.a:0 "叫吉田茂去一趟南京，顺便从库存里找点老东西拨给他们"


  JAP_countryevent.4.t:0 "中南半岛现状"
  JAP_countryevent.4.d:0 "接下来的消息来自中南半岛与马来半岛的其他国家，这些国家都是在“东亚战争”中帝国通过与英帝国的血战拿下来的，战后的这些国家与越南类似，都是在应付游击作战。自30年代初以来，这些地方的合作政府借着“清缴反日游击队”的名头在当地大杀特杀，成片的毁坏村庄，屠杀平民。而这种情况自30年代末40年代初后便愈发猖獗；当时，帝国本土爆发了“宪政危机”，帝国开始有意识地将冈村宁次、坂垣征四郎、东条英机等军队“一夕会”少壮派派遣到这些地方担任驻地武官，这些人上任之后相比前几届武官，手段残忍程度可谓有过之而无不及。这些国家的报告从来不是相比去年增加了多少产出，而是又清缴了多少游击队，或者换句话说："
  JAP_countryevent.4.a:0 "那帮疯子又杀了多少人。"

  JAP_countryevent.5.t:0 "索要经费开支"
  JAP_countryevent.5.d:0 "与缅甸等国的报告同时递交的是菲律宾和泰国的报告，这两个国家是在“东亚战争”爆发后主动加入共荣圈的国家，然而在战后他们也与我们有些貌合神离了。与往年一样的是，菲律宾和泰国以“镇压反日游击队”和“资源开发”为由向我们索要大量的经费与技术。而今年，他们又要求我们为其援建机场以“抵抗澳大利亚可能的北上”。虽然他们的理由看似合理，当地也确实存在反日游击队，但他们的经费要求似乎有点太高了不是吗？"
  JAP_countryevent.5.a:0 "他们要多少我们给多少。"
  JAP_countryevent.5.b:0 "帝国不会为了这种‘二流国家’掏一分钱！"


  JAP_countryevent.6.t:0 "印尼现状"
  JAP_countryevent.6.d:0 "在泰国和菲律宾递交报告后，印尼的报告才姗姗来迟。印尼是我们在“东亚战争”中耗费了一年的心血与天文数字般的人力物力财力才夺来的。而事实证明这一付出是值得的。自1930年拓殖务省与兴亚院建立以来，印尼为帝国陆海军提供了九成的石油、五成的橡胶以及其他大量的军需资源。今年的报告如同往年一样，依旧滔滔不绝的列举着今年的石油橡胶等资源的产出，但令拓殖务省与农林省的文官们感到诧异的是，印尼的报告出口数据始终无法等于实际运往帝国本土和共荣圈内部其他国家的总和。"
  JAP_countryevent.6.a:0 "也许是拓殖务省那帮人算错了吧。"
  JAP_countryevent.6.b:0 "或许我们得留意一下"



  RAJ_war_newsevent.1.t:0 "印度入侵巴基斯坦"
  RAJ_war_newsevent.1.d:0 "自从英国的统治在印度半岛上崩溃以来，这片古老的大地被划分为巴基斯坦和印度两个部分，教派的隔阂与领土的争端让新生的两个国家从诞生之初便剑拔弩张，边境的摩擦从未停歇。而今，鲍斯所率领的印度国民军正式向巴基斯坦宣战，嘹亮的军号划破了南亚次大陆的晨雾，印度向着巴基斯坦的边境重镇疾驰而去。"
  RAJ_war_newsevent.1.a:0 "有趣"


  usa_meme.1.t:0 "特朗普控制美国"
  usa_meme.1.d:0 "特朗普回来了，身为未来的第45任、第47任美国总统。特朗普带着所有的记忆回到了儿时，特朗普通过全国广播，特朗普以一种名为MEGA的病毒控制了全美的人民。\n\n特朗普就任后，扬言让墨西哥和加拿大成为美国的新领土，据消息称，大批美军已经开拔至墨西哥，加拿大等边境地区。"
  usa_meme.1.a:0 "我去，不早说"
  
