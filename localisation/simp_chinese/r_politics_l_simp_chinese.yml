  JAP_party_1_text:0 "£GFX_Social_Masses_Party_logo£ 社大党"
  JAP_party_1_text_desc:0 "\n£GFX_Social_Masses_Party_logo£ 社大党\n\n党寇：片山哲\n\n影响力：§H[?party_0_var]%§!\n满意度：§H[?party_1_var]%§!\n\n\n\n\n£GFX_Katayama_Tetsu£\n\n\n\n\n\n作为日本左翼运动第二个高潮期（1918-1940年）的代表性人物，麻生久这个名字或许今天声名不显，当时却在左翼运动中赫赫有名。\n\n\n§H“在日本的国情下，打倒资本主义的社会改革，将使军队和无产阶级的合理结合成为必然，为了达到目的，除促成这个必然外，别无他途。”§!" 
  JAP_party_2_text:0 "£GFX_Civil_Affairs_Association_logo£ 民政党"
  JAP_party_2_text_desc:0 "\n£GFX_Civil_Affairs_Association_logo£ 民政党\n\n党寇：斋藤隆夫\n\n影响力：§H[?party_0_var]%§!\n满意度：§H[?party_1_var]%§!\n\n\n\n\n£GFX_Takao_Saito£\n\n\n\n\n\n作为日本左翼运动第二个高潮期（1918-1940年）的代表性人物，麻生久这个名字或许今天声名不显，当时却在左翼运动中赫赫有名。\n\n\n§H“在日本的国情下，打倒资本主义的社会改革，将使军队和无产阶级的合理结合成为必然，为了达到目的，除促成这个必然外，别无他途。”§!" 
  JAP_party_3_text:0 "£GFX_Zongheng_Association_logo£ 纵横会"
  JAP_party_3_text_desc:0 "\n£GFX_Zongheng_Association_logo£ 纵横会\n\n党寇：中野正刚\n\n影响力：§H[?party_0_var]%§!\n满意度：§H[?party_1_var]%§!\n\n\n\n\n£GFX_Masataka_Nakano£\n\n\n\n\n\n1920年国会选举中，中野以「立即实施普选」为纲领，当选日本众议院议员，后加入犬养毅的革新俱乐部，被认为是国会内的“左派”党人活跃在大正民主运动的前沿，与社会主义者也有过交际，参加过满川龟太郎牵头的月会性质的早期革新派论坛“老壮会”。\n\n中野主张废除现有内阁制度，将内政、外交与军事大权集中于一个被称为「国务院」的机关；在议会制度与社会普遍关心的选举舞弊问题上，首先要推动「选举公营」，由国家与社会公益组织来承担选举开支，确保选举公正；最后是如何实践改革，则要「限制传统政党参与」「建立强有力的少数派国民内阁」「建立以一年为期限的授权内阁，准许他们执行非常时期国策所需的特别权力」与北一辉等国家主义者不同，中野正刚似乎有意忽略了天皇的存在，他的改造文献中没有任何一字提及「皇国」「天皇」，这是相当罕见的情况，也彰显了他的「民本主义」出身——尽管他没有参与「国体明征运动」，也对美浓部达吉的「天皇机关说」保持距离。\n\n\n§H“南北東西帰去来，夜深同看千巌”§!" 
  JAP_party_4_text:0 "£GFX_Seiyukai_logo£ 政友会"
  JAP_party_4_text_desc:0 "\n£GFX_Seiyukai_logo£ 政友会\n\n党寇：金光庸夫\n\n影响力：§H[?party_0_var]%§!\n满意度：§H[?party_1_var]%§!\n\n\n\n\n£GFX_Yasuo_Kanemitsu£\n\n\n\n\n\n作为日本左翼运动第二个高潮期（1918-1940年）的代表性人物，麻生久这个名字或许今天声名不显，当时却在左翼运动中赫赫有名。\n\n\n§H“在日本的国情下，打倒资本主义的社会改革，将使军队和无产阶级的合理结合成为必然，为了达到目的，除促成这个必然外，别无他途。”§!" 
