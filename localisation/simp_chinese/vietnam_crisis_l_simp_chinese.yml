 # ====================================
 # 大藏省紧急报告事件
 # ====================================
 JAP.vietnam_crisis.3.t:0 "大藏省的紧急报告"
 JAP.vietnam_crisis.3.d:0 "显而易见的是，无论是陆海军还是众议院，目前都严重低估了越南人的抵抗意志。田中新一曾经承诺的"一年解决越南战争"时间还未过半，当初众议院批准的"特别预算"就即将耗尽。大藏大臣东乡实在内阁会议上严肃警告总理金光，如果越南战争再进行下去，恐怕"会面临财政危机"。\n\n同时，东乡还说，随着南洋地区陷入战火，目前南洋地区的军需订单水涨船高，而国内的产能已然告急。听闻消息的陆军部长东久迩宫亲王也恐吓道："如果军需产能跟不上，那么在前线的将士将陷入补给短缺，陆军对于内阁的新任也将需要考量。"
 JAP.vietnam_crisis.3.a:0 "怎么头疼的事情这么多"

 # ====================================
 # 众议院危机事件
 # ====================================
 JAP.vietnam_crisis.4.t:0 "众议院危机"
 JAP.vietnam_crisis.4.d:0 "金光首相所担忧的，内阁的大危机来了，由于现任内阁没有按照承诺在一年以内结束越南战争，众议院已经对内阁萌生了不满。众议院议员、民政党总裁斋藤隆夫在众议院表示："躲在'圣战'之美名下，误国家百年大计，万万不可。内阁从战争开始又说是国际正义、又说是道义外交...未必是日本国家利益所在。"他的演讲在众议院引起了轩然大波。\n\n而最糟糕的消息远不止于此，根据可靠消息，众议院议长，年近九旬的"宪政之神"尾崎行雄已经准备代表众议院向内阁提出不信任案。内阁的生死存亡如今已然拴在一条线上。"
 JAP.vietnam_crisis.4.a:0 "事到如今，只有解散众议院了"

